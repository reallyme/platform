[package]
name = "reallyme-app-kit"
description = "Host-neutral application contracts and conventions for ReallyMe Platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["application", "architecture", "connect-rpc", "grpc", "cloudflare-workers"]
categories = ["development-tools"]
publish = ["crates-io"]
include = ["/src/**/*.rs", "/Cargo.toml", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[features]
default = []
native-http = ["dep:bytes", "dep:reqwest", "dep:rustls", "dep:rustls-native-certs", "dep:webpki-roots"]

[dependencies]
rustls = { workspace = true, optional = true }
rustls-native-certs = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
metrics.workspace = true
reqwest = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
url.workspace = true
zeroize.workspace = true

[dev-dependencies]
futures-util.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
tokio.workspace = true

[lints]
workspace = true
