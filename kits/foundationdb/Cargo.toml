[package]
name = "reallyme-foundationdb-kit"
description = "Production FoundationDB connector and tenant primitives for ReallyMe Platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["foundationdb", "database", "transactions", "tenants"]
categories = ["asynchronous", "database"]
publish = ["crates-io"]
include = ["/src/**/*.rs", "/Cargo.toml", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE", "/build.rs"]
build = "build.rs"
autobins = false

[dependencies]
buffa = { workspace = true, features = ["zeroize"] }
bytes = { workspace = true }
foundationdb = { workspace = true, features = ["embedded-fdb-include", "fdb-7_3", "tenant-experimental"] }
# Keep the C API version aligned with the Rust binding. Recovery needs the
# resolved ID of an opened tenant, which the Rust binding does not expose.
foundationdb-sys = { workspace = true, optional = true, features = ["embedded-fdb-include", "fdb-7_3"] }
getrandom = { version = "0.4", optional = true }
metrics = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true }
zeroize.workspace = true

[dev-dependencies]
temp-env = { workspace = true }

[features]
default = []
metrics = ["dep:metrics"]
# Exposes tenant provisioning helpers (create/delete/list). Off by default;
# enable only in operator/admin tooling.
tenant-admin = ["dep:foundationdb-sys", "dep:getrandom", "dep:serde", "dep:serde_json", "dep:tempfile"]

[[bin]]
name = "fdb-tenant-admin"
path = "src/bin/fdb-tenant-admin.rs"
required-features = ["tenant-admin"]

[lints]
workspace = true
