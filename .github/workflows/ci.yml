name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  BUF_VERSION: 1.72.0
  BUFFA_VERSION: 0.9.2
  CONNECTRPC_CODEGEN_VERSION: 0.9.0
  BUF_LINUX_X86_64_SHA256: 8720830e26a733da55bb89bcd3cb44849c0965fc0c44fb5d691cccdc64dca5af
  FDB_CLIENT_SHA256: b6c263723009bddbc30b6ae8cf9854340bd35cef14152abb0da8fb5af2b91254
  FDB_VERSION: 7.3.77
  CARGO_AUDIT_VERSION: 0.22.2
  CARGO_DENY_VERSION: 0.20.2
  CARGO_SEMVER_CHECKS_VERSION: 0.50.0

jobs:
  rust-fast:
    name: Rust fast gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.99.0
          components: clippy,rustfmt
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu,wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install Ripgrep for repository policy checks
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep
          rg --version

      - name: Install Buf
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/buf/bin"
          mkdir -p "$install_dir"
          curl --fail-with-body --location --proto '=https' --tlsv1.2 \
            --retry 5 --retry-all-errors \
            --output "$install_dir/buf" \
            "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64"
          printf '%s  %s\n' "$BUF_LINUX_X86_64_SHA256" "$install_dir/buf" \
            | sha256sum --check --strict
          chmod 0755 "$install_dir/buf"
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"

      - name: Install FoundationDB client
        shell: bash
        run: |
          set -euo pipefail
          package_name="foundationdb-clients_${FDB_VERSION}-1_amd64.deb"
          package_path="$RUNNER_TEMP/$package_name"
          curl --fail-with-body --location --proto '=https' --tlsv1.2 \
            --retry 5 --retry-all-errors \
            --output "$package_path" \
            "https://github.com/apple/foundationdb/releases/download/${FDB_VERSION}/${package_name}"
          printf '%s  %s\n' "$FDB_CLIENT_SHA256" "$package_path" \
            | sha256sum --check --strict
          sudo dpkg -i "$package_path"

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Set up pnpm and Node for Worker validation
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          cache: true
          cache-dependency-path: workers/example/pnpm-lock.yaml
          working-directory: workers/example
          install: false

      - name: Run shared ReallyMe release-readiness policy
        env:
          REALLYME_RELEASE_READINESS_REQUIRE_TRACKED: "1"
        run: >-
          npm exec --yes
          --allow-git=root
          --package=github:reallyme/release-readiness#5c2da5e5d5795c2c895d0dca0819287ee7101207
          -- reallyme-release-readiness

      - name: Install Rust protobuf generators
        run: |
          cargo install protoc-gen-buffa --version "$BUFFA_VERSION" --locked
          cargo install protoc-gen-buffa-packaging --version "$BUFFA_VERSION" --locked
          cargo install connectrpc-codegen --version "$CONNECTRPC_CODEGEN_VERSION" --locked

      - name: Generate Rust contracts
        run: scripts/generation/generate-rust-contracts.sh

      - name: Verify generated contracts are current
        run: |
          git diff --exit-code -- apps/example/contract/src/generated
          test -z "$(git ls-files --others --exclude-standard apps/example/contract/src/generated)"

      - name: Install pinned Worker build tool
        run: cargo install worker-build --version 0.8.7 --locked

      - name: Validate Worker deployment bundle
        run: scripts/build/check-worker.sh

      - name: Cargo fmt
        run: cargo fmt --all -- --check

      - name: Cargo check
        run: cargo check --locked --workspace --all-features

      - name: Verify minimum supported Rust version
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          cargo +1.99.0 check --locked --workspace --all-features

      - name: Cargo test
        run: cargo test --locked --workspace --all-features

      - name: Cargo default and no-default feature tests
        run: |
          cargo test --locked --workspace
          cargo test --locked --workspace --no-default-features
          cargo test --locked -p reallyme-server-kit --no-default-features

      - name: Cargo doc tests
        run: cargo test --locked --workspace --all-features --doc

      - name: Rustdoc warnings
        run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --workspace --all-features --no-deps

      - name: Cargo clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Install cargo-deny
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-deny@${{ env.CARGO_DENY_VERSION }}

      - name: Install cargo-audit
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-audit@${{ env.CARGO_AUDIT_VERSION }}

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-semver-checks@${{ env.CARGO_SEMVER_CHECKS_VERSION }}

      - name: Dependency and public API checks
        run: |
          cargo deny --all-features check
          cargo audit
          baseline_tag="$(git describe --tags --match 'v[0-9]*' --abbrev=0)"
          cargo semver-checks check-release --workspace \
            --baseline-rev "$baseline_tag" --release-type patch

      - name: Feature separation
        run: |
          scripts/conformance/verify-example-app-feature-separation.sh
          scripts/conformance/verify-server-kit-feature-separation.sh

      - name: Test release automation
        run: node --test scripts/release/*.test.mjs

      - name: Verify crates.io publish order and metadata
        run: node scripts/release/publish_crates_in_order.mjs order

      - name: Contract boundaries
        run: scripts/policy/verify-contract-boundaries.sh

      - name: Crypto dependency policy
        run: scripts/policy/verify-crypto-policy.sh

      - name: Workspace standards
        run: scripts/policy/verify-workspace-standards.sh

  rust-full:
    name: Rust full audit suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.99.0
          components: clippy,rustfmt
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu,wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install Ripgrep for repository policy checks
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep
          rg --version

      - name: Install Buf
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/buf/bin"
          mkdir -p "$install_dir"
          curl --fail-with-body --location --proto '=https' --tlsv1.2 \
            --retry 5 --retry-all-errors \
            --output "$install_dir/buf" \
            "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64"
          printf '%s  %s\n' "$BUF_LINUX_X86_64_SHA256" "$install_dir/buf" \
            | sha256sum --check --strict
          chmod 0755 "$install_dir/buf"
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"

      - name: Install FoundationDB client
        run: |
          set -euo pipefail
          package_name="foundationdb-clients_${FDB_VERSION}-1_amd64.deb"
          package_path="$RUNNER_TEMP/$package_name"
          curl --fail-with-body --location --proto '=https' --tlsv1.2 \
            --retry 5 --retry-all-errors \
            --output "$package_path" \
            "https://github.com/apple/foundationdb/releases/download/${FDB_VERSION}/${package_name}"
          printf '%s  %s\n' "$FDB_CLIENT_SHA256" "$package_path" \
            | sha256sum --check --strict
          sudo dpkg -i "$package_path"

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Set up pnpm and Node for Worker validation
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          cache: true
          cache-dependency-path: workers/example/pnpm-lock.yaml
          working-directory: workers/example
          install: false

      - name: Run shared ReallyMe release-readiness policy
        env:
          REALLYME_RELEASE_READINESS_REQUIRE_TRACKED: "1"
        run: >-
          npm exec --yes
          --allow-git=root
          --package=github:reallyme/release-readiness#5c2da5e5d5795c2c895d0dca0819287ee7101207
          -- reallyme-release-readiness

      - name: Install Rust protobuf generators
        run: |
          cargo install protoc-gen-buffa --version "$BUFFA_VERSION" --locked
          cargo install protoc-gen-buffa-packaging --version "$BUFFA_VERSION" --locked
          cargo install connectrpc-codegen --version "$CONNECTRPC_CODEGEN_VERSION" --locked

      - name: Generate Rust contracts
        run: scripts/generation/generate-rust-contracts.sh

      - name: Install pinned Worker build tool
        run: cargo install worker-build --version 0.8.7 --locked

      - name: Validate Worker deployment bundle
        run: scripts/build/check-worker.sh

      - name: Cargo fmt
        run: cargo fmt --all -- --check

      - name: Cargo check
        run: cargo check --locked --workspace --all-features

      - name: Cargo test
        run: cargo test --locked --workspace --all-features

      - name: Start NATS JetStream
        run: |
          docker run --detach \
            --name reallyme-ci-nats \
            --publish 4222:4222 \
            --publish 8222:8222 \
            nats:2 \
            -js \
            -m 8222
          for _attempt in {1..30}; do
            if (echo > /dev/tcp/127.0.0.1/4222) >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs reallyme-ci-nats
          exit 1

      - name: Run nats integration tests
        env:
          REALLYME_RUN_NATS_INTEGRATION: "1"
        run: |
          set -euo pipefail
          cargo test --locked -p reallyme-nats-kit --features testing --lib -- --list \
            | rg '^consumer::tests::real_publish_consume_and_ack_round_trip: test$'
          cargo test --locked -p reallyme-nats-kit --features testing --lib \
            consumer::tests::real_publish_consume_and_ack_round_trip -- --ignored --exact

      - name: Start PostgreSQL
        run: |
          docker run --detach \
            --name reallyme-ci-postgres \
            --publish 5432:5432 \
            --env POSTGRES_PASSWORD=reallyme-integration-password \
            --env POSTGRES_DB=reallyme_integration \
            postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
          for _attempt in {1..30}; do
            if docker exec reallyme-ci-postgres pg_isready --username postgres --dbname reallyme_integration; then
              exit 0
            fi
            sleep 1
          done
          docker logs reallyme-ci-postgres
          exit 1

      - name: Run PostgreSQL integration tests
        env:
          REALLYME_RUN_POSTGRES_INTEGRATION: "1"
          REALLYME_POSTGRES_INTEGRATION_URI: >-
            postgres://postgres:reallyme-integration-password@127.0.0.1:5432/reallyme_integration
        run: |
          set -euo pipefail
          cargo test --locked -p reallyme-postgres-kit --test postgres_integration -- --list \
            | rg '^live_pool_transactions_and_error_classification: test$'
          cargo test --locked -p reallyme-postgres-kit --test postgres_integration \
            live_pool_transactions_and_error_classification -- --ignored --exact

      - name: Start FoundationDB
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach \
            --name reallyme-ci-fdb \
            --network host \
            --env FDB_CLUSTER_FILE=/var/fdb/fdb.cluster \
            --env FDB_NETWORKING_MODE=host \
            --env FDB_PORT=4500 \
            --tmpfs /var/fdb/data:rw,size=2g \
            --tmpfs /var/fdb/logs:rw,size=2g \
            "foundationdb/foundationdb:${FDB_VERSION}"
          configured=0
          for _attempt in {1..30}; do
            if docker exec reallyme-ci-fdb fdbcli --exec 'configure new single memory' 2>&1 \
              | rg 'Database created'; then
              configured=1
              break
            fi
            sleep 1
          done
          if ((configured == 0)); then
            docker logs reallyme-ci-fdb
            exit 1
          fi
          docker exec reallyme-ci-fdb fdbcli --exec 'configure tenant_mode=optional_experimental'
          docker exec reallyme-ci-fdb cat /var/fdb/fdb.cluster > "$RUNNER_TEMP/fdb.cluster"
          printf 'FDB_CLUSTER_FILE=%s\n' "$RUNNER_TEMP/fdb.cluster" >> "$GITHUB_ENV"

      - name: Provision FoundationDB integration tenant
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --quiet -p reallyme-foundationdb-kit \
            --features tenant-admin --bin fdb-tenant-admin -- \
            ensure foundationdb-kit-integration

      - name: Run FoundationDB integration test
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p reallyme-foundationdb-kit \
            --test foundationdb_integration -- --list \
            | rg '^live_connector_proves_cluster_and_tenant_readiness: test$'
          cargo test --locked -p reallyme-foundationdb-kit \
            --test foundationdb_integration \
            live_connector_proves_cluster_and_tenant_readiness -- --ignored --exact
          cargo test --locked -p reallyme-foundationdb-kit \
            --features tenant-admin --test foundationdb_integration \
            live_tenant_delete_clears_metadata_but_refuses_application_data -- --ignored --exact

      - name: Start Typesense
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach \
            --name reallyme-ci-typesense \
            --publish 127.0.0.1:8108:8108 \
            --tmpfs /data:rw,size=1g \
            typesense/typesense@sha256:dea1b62b7b6e374939349ba58843218473942501b3a17cd07170e9ca70dbbc0c \
            --data-dir /data --api-key=platform-integration-key
          for _attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8108/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs reallyme-ci-typesense
          exit 1

      - name: Run Typesense integration test
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p reallyme-typesense-kit \
            --test typesense_integration -- --list \
            | rg '^connector_reports_live_typesense_ready: test$'
          cargo test --locked -p reallyme-typesense-kit \
            --test typesense_integration \
            connector_reports_live_typesense_ready -- --ignored --exact

      - name: Start Valkey
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach \
            --name reallyme-ci-valkey \
            --publish 127.0.0.1:6379:6379 \
            valkey/valkey@sha256:475ee65cc75c327407458f5096cdd36954b3de3fc83f4c8ac31a4a8edecbf49e \
            valkey-server --save '' --appendonly no
          for _attempt in {1..30}; do
            if docker exec reallyme-ci-valkey valkey-cli ping | rg '^PONG$'; then
              exit 0
            fi
            sleep 1
          done
          docker logs reallyme-ci-valkey
          exit 1

      - name: Run Valkey integration test
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p reallyme-valkey-kit \
            --test valkey_integration -- --list \
            | rg '^cache_lease_and_counter_commands_are_atomic: test$'
          cargo test --locked -p reallyme-valkey-kit \
            --test valkey_integration \
            cache_lease_and_counter_commands_are_atomic -- --ignored --exact

      - name: Cargo doc tests
        run: cargo test --locked --workspace --all-features --doc

      - name: Cargo clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test release automation
        run: node --test scripts/release/*.test.mjs

      - name: Contract boundaries
        run: scripts/policy/verify-contract-boundaries.sh

      - name: Crypto dependency policy
        run: scripts/policy/verify-crypto-policy.sh

      - name: Example app feature separation
        run: scripts/conformance/verify-example-app-feature-separation.sh

      - name: Server-kit feature separation
        run: scripts/conformance/verify-server-kit-feature-separation.sh

      - name: Workspace standards
        run: scripts/policy/verify-workspace-standards.sh
