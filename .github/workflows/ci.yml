# Generated by release-readiness --render-ci from .github/release-readiness.json.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  policy:
    if: ${{ github.repository_owner == 'reallyme' && toJSON(github.event.repository.private) == 'false' && (github.event.repository.visibility == null || github.event.repository.visibility == 'public') }}
    uses: ./.github/workflows/release-readiness.yml

  code:
    if: ${{ github.repository_owner == 'reallyme' && toJSON(github.event.repository.private) == 'false' && (github.event.repository.visibility == null || github.event.repository.visibility == 'public') }}
    uses: ./.github/workflows/rust-ci.yml

  proto:
    if: ${{ github.repository_owner == 'reallyme' && toJSON(github.event.repository.private) == 'false' && (github.event.repository.visibility == null || github.event.repository.visibility == 'public') }}
    uses: ./.github/workflows/protobuf-ci.yml

  formal:
    if: ${{ github.repository_owner == 'reallyme' && toJSON(github.event.repository.private) == 'false' && (github.event.repository.visibility == null || github.event.repository.visibility == 'public') }}
    uses: ./.github/workflows/formal-methods.yml

  required:
    name: Required CI
    if: ${{ always() && github.repository_owner == 'reallyme' && toJSON(github.event.repository.private) == 'false' && (github.event.repository.visibility == null || github.event.repository.visibility == 'public') }}
    needs: [policy, code, proto, formal]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify planned checks
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
          HEAD_SHA: ${{ github.sha }}
          FIXED_PLAN: '{"policy":true,"code":true,"proto":true,"formal":true}'
        run: |
          set -euo pipefail
          if ! jq -er --arg sha "$HEAD_SHA" --arg fixed "$FIXED_PLAN" '
            . as $needs |
            (if $fixed != "" then $fixed else .scope.outputs.lanes end | try fromjson catch null) as $plan |
            if ($sha | test("^[a-f0-9]{40}$") | not) or
               ($fixed == "" and $needs.scope.result != "success") or ($plan | type) != "object" then
              error("CI scope did not produce a valid plan")
            elif ($plan | keys) != ($needs | del(.scope) | keys) or $plan.policy != true then
              error("CI scope did not plan every lane")
            else
              [ $plan | to_entries[] | .key as $lane |
                (if .value == true then "success" elif .value == false then "skipped" else "invalid" end) as $expected |
                $needs[$lane].result as $actual |
                if $expected == "invalid" or $expected != $actual then
                  "\($lane) expected \($expected), got \($actual)"
                elif $expected == "success" and $needs[$lane].outputs.verified_sha != $sha then
                  "\($lane) did not verify the candidate SHA"
                else empty end
              ] | if length == 0 then "Required CI passed" else error(join("; ")) end
            end
          ' <<<"$NEEDS"; then
            echo "::error::A required CI lane failed, was cancelled, or disagreed with the change plan."
            exit 1
          fi
