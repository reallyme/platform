name: Publish Hephaestus agent image

on:
  workflow_dispatch:
    inputs:
      registry:
        description: Registry destination for this publish.
        required: true
        default: ghcr
        type: choice
        options:
          - ghcr
          - vultr
          - both
      tag:
        description: Optional immutable or promotion tag, for example prod-2026-09-11.
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: hephaestus-agent-image-${{ github.ref }}-${{ inputs.registry }}
  cancel-in-progress: false

env:
  GHCR_IMAGE: ghcr.io/reallyme/hephaestus-agent
  VULTR_IMAGE: ams.vultrcr.com/reallyme/hephaestus-agent
  RUST_VERSION: "1.98.1"

jobs:
  publish:
    name: Publish Hephaestus agent
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Prepare image tags
        id: tags
        shell: bash
        env:
          EXTRA_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::12}"

          {
            echo "ghcr<<EOF"
            echo "${GHCR_IMAGE}:sha-${short_sha}"
            if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
              echo "${GHCR_IMAGE}:staging"
            fi
            if [[ -n "${EXTRA_TAG}" ]]; then
              echo "${GHCR_IMAGE}:${EXTRA_TAG}"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "vultr<<EOF"
            echo "${VULTR_IMAGE}:sha-${short_sha}"
            if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
              echo "${VULTR_IMAGE}:staging"
            fi
            if [[ -n "${EXTRA_TAG}" ]]; then
              echo "${VULTR_IMAGE}:${EXTRA_TAG}"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Login to GHCR
        if: inputs.registry == 'ghcr' || inputs.registry == 'both'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GHCR image
        if: inputs.registry == 'ghcr' || inputs.registry == 'both'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: components/hephaestus/agent/deploy/Dockerfile
          target: runtime
          push: true
          build-args: |
            RUST_VERSION=${{ env.RUST_VERSION }}
          tags: ${{ steps.tags.outputs.ghcr }}
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.title=hephaestus-agent
            org.opencontainers.image.description=ReallyMe Hephaestus host agent
            org.opencontainers.image.source=https://github.com/reallyme/platform
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=hephaestus-agent
          cache-to: type=gha,mode=max,scope=hephaestus-agent

      - name: Login to Vultr Container Registry
        if: inputs.registry == 'vultr' || inputs.registry == 'both'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ams.vultrcr.com
          username: ${{ secrets.VULTR_REGISTRY_USERNAME }}
          password: ${{ secrets.VULTR_REGISTRY_PASSWORD }}

      - name: Publish Vultr image
        if: inputs.registry == 'vultr' || inputs.registry == 'both'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: components/hephaestus/agent/deploy/Dockerfile
          target: runtime
          push: true
          build-args: |
            RUST_VERSION=${{ env.RUST_VERSION }}
          tags: ${{ steps.tags.outputs.vultr }}
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.title=hephaestus-agent
            org.opencontainers.image.description=ReallyMe Hephaestus host agent
            org.opencontainers.image.source=https://github.com/reallyme/platform
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=hephaestus-agent
          cache-to: type=gha,mode=max,scope=hephaestus-agent
