name: Crates.io Release

run-name: ReallyMe Platform crates.io release @ ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version from the successful package preflight
        required: false
        type: string
      source_sha:
        description: Full source SHA from the successful package preflight summary
        required: false
        type: string

concurrency:
  group: crates-release-${{ github.sha }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  verify-preflight:
    name: Verify reviewed package preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      preflight_run_id: ${{ steps.candidate.outputs.preflight_run_id }}
      package_artifact_ids: ${{ steps.candidate.outputs.package_artifact_ids }}
      release_sha: ${{ steps.verify-source.outputs.release_sha }}
      release_version: ${{ steps.verify-source.outputs.release_version }}
    steps:
      - name: Checkout current main release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0

      - name: Resolve current release commit and version
        id: verify-source
        env:
          RELEASE_SHA: ${{ inputs.source_sha || github.sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SOURCE_DERIVE_VERSION: ${{ inputs.version == '' && '1' || '0' }}
          RELEASE_SOURCE_WRITE_GITHUB_OUTPUT: "1"
        run: node scripts/release/verify_release_source.mjs

      - name: Checkout release-readiness runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reallyme/release-readiness
          ref: 55115f21d5bf9a3fbc1bb8d10484aecba6e7bd8f
          path: .release-readiness
          persist-credentials: false

      - name: Verify release candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.verify-source.outputs.release_version }}
          RELEASE_TAG: v${{ steps.verify-source.outputs.release_version }}
          SOURCE_SHA: ${{ steps.verify-source.outputs.release_sha }}
        run: >-
          node .release-readiness/scripts/run-consumer-check.mjs
          --check-release crates publish "$RELEASE_VERSION" "$RELEASE_TAG" "$SOURCE_SHA"

  publish:
    name: Publish ReallyMe Platform crates
    needs: verify-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    concurrency:
      group: >-
        crates-release-${{ needs.verify-preflight.outputs.release_version }}-${{
        needs.verify-preflight.outputs.release_sha }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
    env:
      RELEASE_SHA: ${{ needs.verify-preflight.outputs.release_sha }}
      RELEASE_VERSION: ${{ needs.verify-preflight.outputs.release_version }}
    steps:
      - name: Checkout certified release commit without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-preflight.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Download verified package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: ${{ needs.verify-preflight.outputs.preflight_run_id }}
          artifact-ids: ${{ needs.verify-preflight.outputs.package_artifact_ids }}
          github-token: ${{ github.token }}
          digest-mismatch: error
          merge-multiple: true
          path: ${{ runner.temp }}/release-package

      - name: Verify preflight conclusion, commit, version, and artifact
        env:
          GH_TOKEN: ${{ github.token }}
          PREFLIGHT_RUN_ID: ${{ needs.verify-preflight.outputs.preflight_run_id }}
          RELEASE_ATTESTATION_PATH: ${{ runner.temp }}/release-package/crates-preflight.json
        run: node scripts/release/verify_release_attestation.mjs

      - name: Revalidate current main immediately before publication
        run: node scripts/release/verify_release_source.mjs

      - name: Publish crates in reviewed dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          CRATE_ARCHIVE_DIR: ${{ runner.temp }}/release-package
        run: node scripts/release/publish_crates_in_order.mjs publish

      - name: Summarize crates.io publication
        run: |
          {
            echo '## ReallyMe Platform crates.io publication completed'
            echo
            for crate in \
              reallyme-app-kit \
              reallyme-server-kit \
              reallyme-foundationdb-kit \
              reallyme-postgres-kit \
              reallyme-nats-kit \
              reallyme-typesense-kit \
              reallyme-valkey-kit \
              reallyme-s3-kit \
              reallyme-platform; do
              echo "- [${crate} ${RELEASE_VERSION}](https://crates.io/crates/${crate}/${RELEASE_VERSION})"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  finalize:
    name: Tag and create GitHub release
    needs: [verify-preflight, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_SHA: ${{ needs.verify-preflight.outputs.release_sha }}
      RELEASE_VERSION: ${{ needs.verify-preflight.outputs.release_version }}
    steps:
      - name: Create release tag through the GitHub API
        id: release-tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          existing_commit=''
          if resolved_commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq '.sha' 2>/dev/null)"; then
            existing_commit="$resolved_commit"
          fi
          if [[ -n "$existing_commit" && "$existing_commit" != "$RELEASE_SHA" ]]; then
            echo "$tag already exists at a different commit" >&2
            exit 1
          fi
          if [[ -z "$existing_commit" ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              --field ref="refs/tags/$tag" \
              --field sha="$RELEASE_SHA" > /dev/null
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "ReallyMe Platform ${RELEASE_VERSION}" \
            --generate-notes
