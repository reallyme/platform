name: Crates.io Release

run-name: ReallyMe Platform crates.io release @ ${{ github.sha }}

on:
  workflow_dispatch:

concurrency:
  group: crates-release-${{ github.sha }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  FDB_CLIENT_SHA256: b6c263723009bddbc30b6ae8cf9854340bd35cef14152abb0da8fb5af2b91254
  FDB_VERSION: 7.3.77

jobs:
  verify-preflight:
    name: Verify reviewed package preflight
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      preflight_run_id: ${{ steps.resolve-attestation.outputs.preflight_run_id }}
      release_sha: ${{ steps.verify-source.outputs.release_sha }}
      release_version: ${{ steps.verify-source.outputs.release_version }}
    steps:
      - name: Checkout current main release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Resolve current release commit and version
        id: verify-source
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_SOURCE_DERIVE_VERSION: "1"
          RELEASE_SOURCE_WRITE_GITHUB_OUTPUT: "1"
        run: node scripts/release/verify_release_source.mjs

      - name: Resolve latest reviewed package preflight
        id: resolve-attestation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.verify-source.outputs.release_sha }}
          RELEASE_VERSION: ${{ steps.verify-source.outputs.release_version }}
          RELEASE_ATTESTATION_RESOLVE_ONLY: "1"
          RELEASE_ATTESTATION_WRITE_GITHUB_OUTPUT: "1"
          RELEASE_ATTESTATION_WAIT_SECONDS: "3600"
          RELEASE_ATTESTATION_POLL_SECONDS: "20"
        run: node scripts/release/verify_release_attestation.mjs

      - name: Download latest reviewed package attestation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: >-
            reallyme-platform-crates-preflight-${{
            steps.verify-source.outputs.release_version }}-${{
            steps.verify-source.outputs.release_sha }}
          path: release-attestation
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.resolve-attestation.outputs.preflight_run_id }}

      - name: Verify preflight conclusion, commit, version, and artifact
        env:
          GH_TOKEN: ${{ github.token }}
          PREFLIGHT_RUN_ID: ${{ steps.resolve-attestation.outputs.preflight_run_id }}
          RELEASE_SHA: ${{ steps.verify-source.outputs.release_sha }}
          RELEASE_VERSION: ${{ steps.verify-source.outputs.release_version }}
          RELEASE_ATTESTATION_WAIT_SECONDS: "60"
          RELEASE_ATTESTATION_POLL_SECONDS: "10"
        run: node scripts/release/verify_release_attestation.mjs

  publish:
    name: Publish ReallyMe Platform crates
    needs: verify-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    concurrency:
      group: >-
        crates-release-${{ needs.verify-preflight.outputs.release_version }}-${{
        needs.verify-preflight.outputs.release_sha }}
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      RELEASE_SHA: ${{ needs.verify-preflight.outputs.release_sha }}
      RELEASE_VERSION: ${{ needs.verify-preflight.outputs.release_version }}
    steps:
      - name: Checkout certified release commit without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-preflight.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.1

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Restore the reviewed build cache without saving Cargo's transient
          # target/package trees after publication.
          save-if: false

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install FoundationDB client
        shell: bash
        run: |
          set -euo pipefail
          package_name="foundationdb-clients_${FDB_VERSION}-1_amd64.deb"
          package_path="$RUNNER_TEMP/$package_name"
          curl --fail-with-body --location --proto '=https' --tlsv1.2 \
            --retry 5 --retry-all-errors \
            --output "$package_path" \
            "https://github.com/apple/foundationdb/releases/download/${FDB_VERSION}/${package_name}"
          printf '%s  %s\n' "$FDB_CLIENT_SHA256" "$package_path" \
            | sha256sum --check --strict
          sudo dpkg -i "$package_path"

      - name: Revalidate current main immediately before publication
        run: node scripts/release/verify_release_source.mjs

      - name: Publish crates in reviewed dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: node scripts/release/publish_crates_in_order.mjs publish

      - name: Summarize crates.io publication
        run: |
          {
            echo '## ReallyMe Platform crates.io publication completed'
            echo
            for crate in \
              reallyme-app-kit \
              reallyme-server-kit \
              reallyme-foundationdb-kit \
              reallyme-postgres-kit \
              reallyme-nats-kit \
              reallyme-typesense-kit \
              reallyme-valkey-kit \
              reallyme-s3-kit \
              reallyme-platform; do
              echo "- [${crate} ${RELEASE_VERSION}](https://crates.io/crates/${crate}/${RELEASE_VERSION})"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  finalize:
    name: Tag and create GitHub release
    needs: [verify-preflight, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_SHA: ${{ needs.verify-preflight.outputs.release_sha }}
      RELEASE_VERSION: ${{ needs.verify-preflight.outputs.release_version }}
    steps:
      - name: Create release tag through the GitHub API
        id: release-tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          existing_commit=''
          if resolved_commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq '.sha' 2>/dev/null)"; then
            existing_commit="$resolved_commit"
          fi
          if [[ -n "$existing_commit" && "$existing_commit" != "$RELEASE_SHA" ]]; then
            echo "$tag already exists at a different commit" >&2
            exit 1
          fi
          if [[ -z "$existing_commit" ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              --field ref="refs/tags/$tag" \
              --field sha="$RELEASE_SHA" > /dev/null
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "ReallyMe Platform ${RELEASE_VERSION}" \
            --generate-notes
