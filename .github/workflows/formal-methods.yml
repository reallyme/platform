name: Formal methods

on:
  workflow_call:
    outputs:
      verified_sha:
        value: ${{ jobs.proofs.outputs.verified_sha }}

permissions:
  contents: read

jobs:
  proofs:
    name: Verify Rust boundaries and TLA+ models
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      verified_sha: ${{ github.sha }}
    env:
      KANI_VERSION: "0.68.0"
      TLA_TOOLS_VERSION: "1.7.4"
      TLA_TOOLS_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Java 21
        shell: bash
        run: printf '%s\n' "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"

      - name: Install Kani
        timeout-minutes: 10
        run: |
          cargo +stable install kani-verifier --locked --version "$KANI_VERSION"
          cargo +stable kani setup

      - name: Install TLA+ tools
        timeout-minutes: 2
        run: |
          jar="$RUNNER_TEMP/tla2tools.jar"
          curl --fail-with-body --location --proto '=https' --tlsv1.2 \
            --retry 5 --retry-all-errors --output "$jar" \
            "https://github.com/tlaplus/tlaplus/releases/download/v${TLA_TOOLS_VERSION}/tla2tools.jar"
          printf '%s  %s\n' "$TLA_TOOLS_SHA256" "$jar" | sha256sum --check --strict
          printf 'TLA2TOOLS_JAR=%s\n' "$jar" >> "$GITHUB_ENV"

      - name: Verify proof obligations
        timeout-minutes: 22
        shell: bash
        working-directory: .
        run: |
          test "$(git rev-parse --verify HEAD)" = "$GITHUB_SHA"
          git diff --no-ext-diff --exit-code "$GITHUB_SHA" --
          bash -e -o pipefail scripts/conformance/verify-formal-methods.sh
          test "$(git rev-parse --verify HEAD)" = "$GITHUB_SHA"
          git diff --no-ext-diff --exit-code "$GITHUB_SHA" --
