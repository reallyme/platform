version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: Europe/Malta
    open-pull-requests-limit: 5

  # GitHub calls this ecosystem "npm" even when the project uses pnpm.
  # It updates the Worker manifest and checked-in pnpm lockfile only.
  - package-ecosystem: npm
    directory: "/workers/example-worker"
    schedule:
      interval: weekly
      day: tuesday
      time: "06:15"
      timezone: Europe/Malta
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: tuesday
      time: "06:30"
      timezone: Europe/Malta
    open-pull-requests-limit: 5
