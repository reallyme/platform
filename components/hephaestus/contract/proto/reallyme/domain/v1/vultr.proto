syntax = "proto3";

package reallyme.domain.v1;

// VultrRegion is a public region snapshot.
message VultrRegion {
  // Region id.
  string id = 1;
  // City name.
  string city = 2;
  // Country code.
  string country = 3;
  // Continent name.
  string continent = 4;
}

// VultrPlan is a public plan snapshot.
message VultrPlan {
  // Plan id.
  string id = 1;
  // Plan type.
  VultrPlanType plan_type = 2;
  // Virtual CPU count.
  uint32 vcpu_count = 3;
  // RAM in megabytes.
  uint32 ram_mb = 4;
  // Disk size in gigabytes.
  uint32 disk_gb = 5;
  // Monthly cost in cents.
  uint32 monthly_cost_cents = 6;
}

// VultrPlanType mirrors the stable plan families Hephaestus accepts.
enum VultrPlanType {
  // Unspecified plan type.
  VULTR_PLAN_TYPE_UNSPECIFIED = 0;
  // Regular cloud compute.
  VULTR_PLAN_TYPE_CLOUD_COMPUTE = 1;
  // Dedicated cloud.
  VULTR_PLAN_TYPE_DEDICATED_CLOUD = 2;
  // High frequency compute.
  VULTR_PLAN_TYPE_HIGH_FREQUENCY = 3;
  // High performance compute.
  VULTR_PLAN_TYPE_HIGH_PERFORMANCE = 4;
  // Optimized cloud.
  VULTR_PLAN_TYPE_OPTIMIZED_CLOUD = 5;
  // Bare metal.
  VULTR_PLAN_TYPE_BARE_METAL = 6;
  // Cloud GPU.
  VULTR_PLAN_TYPE_CLOUD_GPU = 7;
}

// VultrVpc is a public private-network snapshot.
message VultrVpc {
  // VPC id.
  string id = 1;
  // Region id.
  string region = 2;
  // Operator-visible description.
  string description = 3;
  // Private IPv4 block.
  string ip_block = 4;
  // CIDR prefix length.
  uint32 prefix_length = 5;
}

// VultrInstance is a public VPS snapshot.
message VultrInstance {
  // Instance id.
  string id = 1;
  // Region id.
  string region = 2;
  // Plan id.
  string plan = 3;
  // Operator-visible label.
  string label = 4;
  // Lifecycle status.
  VultrInstanceStatus status = 5;
  // Public IP address when available.
  string main_ip = 6;
  // Private IP address when available.
  string internal_ip = 7;
  // Attached VPC ids known to the instance.
  repeated string vpc_ids = 8;
  // Whether the instance is provisioned as VPC-only.
  bool vpc_only = 9;
}

// VultrInstanceTemplate is a reusable provider-side instance blueprint.
message VultrInstanceTemplate {
  // Template id.
  string id = 1;
  // Plan id.
  string plan = 2;
  // Operator-visible label when set.
  string label = 3;
  // Operating system id when set.
  uint32 os_id = 4;
  // ISO id when set.
  string iso_id = 5;
  // Snapshot id when set.
  string snapshot_id = 6;
  // Marketplace application id when set.
  uint32 marketplace_app_id = 7;
  // Marketplace image id when set.
  uint32 marketplace_image_id = 8;
  // Startup script id when set.
  string script_id = 9;
  // Installed SSH key ids.
  repeated string ssh_key_ids = 10;
  // Attached VPC ids.
  repeated string vpc_ids = 11;
  // Attached Vultr File Storage subscription ids.
  repeated string vfs_ids = 12;
  // Base64-encoded cloud-init user data when set.
  string user_data = 13;
}

// VultrContainerRegistry is a public registry subscription snapshot.
message VultrContainerRegistry {
  // Registry id.
  string id = 1;
  // Registry name.
  string name = 2;
  // Whether the registry is publicly readable.
  bool public = 3;
  // Stable provider URN.
  string urn = 4;
  // Provider-reported storage bytes in use.
  uint64 storage_bytes_used = 5;
}

// VultrContainerRepository is a public repository snapshot inside one registry.
message VultrContainerRepository {
  // Parent registry id.
  string registry_id = 1;
  // Repository image name.
  string name = 2;
  // Operator-visible description when set.
  string description = 3;
  // Pull count when reported.
  uint64 pull_count = 4;
  // Artifact count when reported.
  uint32 artifact_count = 5;
}

// VultrContainerArtifact is one image version or digest inside a repository.
message VultrContainerArtifact {
  // Parent registry id.
  string registry_id = 1;
  // Parent repository image name.
  string repository = 2;
  // OCI digest.
  string digest = 3;
  // Tags currently pointing at this artifact.
  repeated string tags = 4;
  // Compressed size in bytes when reported.
  uint64 size_bytes = 5;
}

// VultrInstanceStatus mirrors stable instance lifecycle states Hephaestus accepts.
enum VultrInstanceStatus {
  // Unspecified instance status.
  VULTR_INSTANCE_STATUS_UNSPECIFIED = 0;
  // Instance is provisioning or changing.
  VULTR_INSTANCE_STATUS_PENDING = 1;
  // Instance is active.
  VULTR_INSTANCE_STATUS_ACTIVE = 2;
  // Instance is stopped.
  VULTR_INSTANCE_STATUS_STOPPED = 3;
  // Instance is suspended by provider policy.
  VULTR_INSTANCE_STATUS_SUSPENDED = 4;
}
