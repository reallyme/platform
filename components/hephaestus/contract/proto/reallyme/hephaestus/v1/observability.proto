syntax = "proto3";

package reallyme.hephaestus.v1;

import "reallyme/hephaestus/v1/types.proto";

service ObservabilityService {
  rpc PlanObservabilityDeployment(PlanObservabilityDeploymentRequest) returns (PlanObservabilityDeploymentResponse);
}

message PlanObservabilityDeploymentRequest {
  ObservabilityDeploymentIntent intent = 1;
}

message PlanObservabilityDeploymentResponse {
  optional ObservabilityDeploymentPlan plan = 1;
  repeated ObservabilityValidationError errors = 2;
}

message ObservabilityDeploymentIntent {
  ProvisioningWorkloadRole workload_role = 1;
  ProvisioningLifecycleAction action = 2;
  string node_name = 3;
  bool docker_host = 4;
  bool prometheus_enabled = 5;
  bool grafana_enabled = 6;
  bool hephaestus_enabled = 7;
  uint32 node_exporter_port = 8;
  uint32 cadvisor_port = 9;
  uint32 prometheus_port = 10;
  uint32 grafana_port = 11;
  uint32 hephaestus_http_port = 12;
  uint32 hephaestus_metrics_port = 13;
  string compose_dir = 14;
  string prometheus_scrape_targets_artifact_path = 15;
  string prometheus_retention_time = 16;
  string prometheus_retention_size = 17;
  repeated ObservabilityScrapePeer scrape_peers = 18;
  ProvisioningSecretRef grafana_admin_password_secret_ref = 19;
  ProvisioningSecretRef grafana_secret_key_secret_ref = 20;
  ProvisioningSecretRef hephaestus_env_secret_ref = 21;
  string hephaestus_config_ref = 22;
  uint32 private_peer_cidr_count = 23;
  uint32 admin_peer_cidr_count = 24;
}

message ObservabilityScrapePeer {
  string hostname = 1;
  string address = 2;
  bool docker_host = 3;
  ProvisioningEnvironment environment = 4;
  ProvisioningDataRegion data_region = 5;
  ProvisioningSite site = 6;
  repeated ProvisioningService services = 7;
  ProvisioningPlacementKind placement_kind = 8;
}

message ObservabilityDeploymentPlan {
  ObservabilityRuntimeConfig runtime_config = 1;
  repeated ObservabilityHostAgentPlan host_agents = 2;
  repeated PrometheusScrapeJobPlan scrape_jobs = 3;
  repeated ObservabilityHttpProbe probes = 4;
  repeated uint32 private_tcp_ports = 5;
  repeated ProvisioningSecretRef required_secret_refs = 6;
  repeated string required_config_refs = 7;
}

message ObservabilityRuntimeConfig {
  ProvisioningWorkloadRole workload_role = 1;
  ProvisioningLifecycleAction action = 2;
  string node_name = 3;
  string compose_dir = 4;
  string prometheus_scrape_targets_artifact_path = 5;
  string prometheus_retention_time = 6;
  string prometheus_retention_size = 7;
  bool prometheus_enabled = 8;
  bool grafana_enabled = 9;
  bool hephaestus_enabled = 10;
}

message ObservabilityHostAgentPlan {
  ObservabilityHostAgentKind kind = 1;
  uint32 port = 2;
  string metrics_path = 3;
  string expected_health_fragment = 4;
  bool private_only = 5;
}

enum ObservabilityHostAgentKind {
  OBSERVABILITY_HOST_AGENT_KIND_UNSPECIFIED = 0;
  OBSERVABILITY_HOST_AGENT_KIND_NODE_EXPORTER = 1;
  OBSERVABILITY_HOST_AGENT_KIND_CADVISOR = 2;
}

message PrometheusScrapeJobPlan {
  string job_name = 1;
  string metrics_path = 2;
  repeated PrometheusStaticTarget targets = 3;
}

message PrometheusStaticTarget {
  string target = 1;
  string hostname = 2;
  ProvisioningEnvironment environment = 3;
  ProvisioningDataRegion data_region = 4;
  ProvisioningSite site = 5;
  repeated ProvisioningService services = 6;
  ObservabilityHostAgentKind metrics_source = 7;
  ProvisioningPlacementKind placement_kind = 8;
}

message ObservabilityHttpProbe {
  uint32 port = 1;
  string path = 2;
  optional string required_body_fragment = 3;
  bool requires_secret = 4;
}

message ObservabilityValidationError {
  ObservabilityValidationErrorReason reason = 1;
}

enum ObservabilityValidationErrorReason {
  OBSERVABILITY_VALIDATION_ERROR_REASON_UNSPECIFIED = 0;
  OBSERVABILITY_VALIDATION_ERROR_REASON_INVALID_ROLE = 1;
  OBSERVABILITY_VALIDATION_ERROR_REASON_INVALID_ACTION = 2;
  OBSERVABILITY_VALIDATION_ERROR_REASON_INVALID_IDENTIFIER = 3;
  OBSERVABILITY_VALIDATION_ERROR_REASON_INVALID_PORT = 4;
  OBSERVABILITY_VALIDATION_ERROR_REASON_DUPLICATE_PORT = 5;
  OBSERVABILITY_VALIDATION_ERROR_REASON_INVALID_PATH = 6;
  OBSERVABILITY_VALIDATION_ERROR_REASON_MISSING_PEER_CIDRS = 7;
  OBSERVABILITY_VALIDATION_ERROR_REASON_MISSING_SCRAPE_TARGETS = 8;
  OBSERVABILITY_VALIDATION_ERROR_REASON_MISSING_SECRET_REF = 9;
  OBSERVABILITY_VALIDATION_ERROR_REASON_MISSING_HEPHAESTUS_CONFIG = 10;
  OBSERVABILITY_VALIDATION_ERROR_REASON_INVALID_PEER = 11;
  OBSERVABILITY_VALIDATION_ERROR_REASON_NO_STACK_COMPONENTS = 12;
}
