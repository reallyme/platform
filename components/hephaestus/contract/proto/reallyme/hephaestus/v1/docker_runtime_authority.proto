syntax = "proto3";

package reallyme.hephaestus.v1;

import "reallyme/hephaestus/v1/docker.proto";

// DockerRuntimeAuthorityService resolves exceptional host authority immediately
// before a node applies a Docker service action. Keeping this policy separate
// from queued actions permits authority to be revoked without rewriting durable
// action history.
service DockerRuntimeAuthorityService {
  rpc ResolveAgentDockerRuntimeAuthority(ResolveAgentDockerRuntimeAuthorityRequest)
      returns (ResolveAgentDockerRuntimeAuthorityResponse);
}

message ResolveAgentDockerRuntimeAuthorityRequest {
  string node_id = 1;
  string action_id = 2;
  string idempotency_key = 3;
  uint64 desired_generation = 4;
  string service_id = 5;
}

message ResolveAgentDockerRuntimeAuthorityResponse {
  optional DockerRuntimeAuthority authority = 1;
}

message DockerRuntimeAuthority {
  uint32 schema_version = 1;
  repeated DockerHostDevice devices = 2;
  repeated DockerLinuxCapability linux_capabilities = 3;
  bool read_only_root_filesystem = 4;
  bool no_new_privileges = 5;
  DockerNetworkMode network_mode = 6;
}

// Host devices are an explicit allowlist because arbitrary device paths would
// turn a workload declaration into host-level filesystem authority.
enum DockerHostDevice {
  DOCKER_HOST_DEVICE_UNSPECIFIED = 0;
  DOCKER_HOST_DEVICE_TUN = 1;
}

// Linux capabilities are deliberately closed and narrowly scoped. Each new
// value requires a security review rather than accepting arbitrary strings.
enum DockerLinuxCapability {
  DOCKER_LINUX_CAPABILITY_UNSPECIFIED = 0;
  DOCKER_LINUX_CAPABILITY_NET_ADMIN = 1;
  DOCKER_LINUX_CAPABILITY_NET_BIND_SERVICE = 2;
}
