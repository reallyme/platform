message ServiceActionTarget {
  optional string service_id = 1;
  optional string service_group_id = 2;
  ServiceKind service_kind = 3;
  optional string region_id = 4;
  optional string site_id = 5;
  optional string tenant_id = 6;
  optional string server_id = 7;
}

