  WORKFLOW_OPERATION_KIND_START_BACKUP = 6;
  WORKFLOW_OPERATION_KIND_CHECK_BACKUP = 7;
  WORKFLOW_OPERATION_KIND_RESTORE_BACKUP = 8;
}

