  RESTORE_EXECUTION_MODE_UNSPECIFIED = 0;
  RESTORE_EXECUTION_MODE_DRY_RUN = 1;
  RESTORE_EXECUTION_MODE_EXECUTE = 2;
}

message HealthCheckTarget {
  ServiceActionTarget target = 1;
  HealthCheckKind kind = 2;
}

enum HealthCheckKind {
  HEALTH_CHECK_KIND_UNSPECIFIED = 0;
  HEALTH_CHECK_KIND_PROVIDER_STATE = 1;
  HEALTH_CHECK_KIND_HOST_STATE = 2;
  HEALTH_CHECK_KIND_SERVICE_STATUS = 3;
  HEALTH_CHECK_KIND_REPLICATION_STATUS = 4;
  HEALTH_CHECK_KIND_FAILOVER_READINESS = 5;
  HEALTH_CHECK_KIND_BACKUP_STATUS = 6;
  HEALTH_CHECK_KIND_ENDPOINT_PROBE = 7;
}

message HealthSnapshot {
  uint32 schema_version = 1;
  string snapshot_id = 2;
  string environment_id = 3;
  google.protobuf.Timestamp collected_at = 4;
  ServiceHealthStatus overall_status = 5;
  repeated HealthSignal signals = 6;
}

message HealthSignal {
  string signal_id = 1;
  ServiceHealthStatus status = 2;
  google.protobuf.Timestamp collected_at = 3;
  string source = 4;
  string summary = 5;
}

message InfrastructureHealthSnapshot {
  uint32 schema_version = 1;
  string snapshot_id = 2;
  string environment_id = 3;
  google.protobuf.Timestamp collected_at = 4;
  ServiceHealthStatus overall_status = 5;
  repeated InfrastructureHealthSignal signals = 6;
  repeated TailscaleIdentitySnapshot tailscale_identities = 7;
  DockerRuntimeHealth docker_runtime = 8;
  HostObservabilityHealth observability = 9;
}

message HostObservabilityHealth {
  NodeExporterHealth node_exporter = 1;
  CadvisorHealth cadvisor = 2;
}

message NodeExporterHealth {
  string service_status = 1;
  bool metrics_reachable = 2;
  uint32 port = 3;
  optional string scrape_target = 4;
}

message CadvisorHealth {
  string container_name = 1;
  bool running = 2;
  bool metrics_reachable = 3;
  uint32 port = 4;
  optional string scrape_target = 5;
}

message TailscaleIdentitySnapshot {
  string hostname = 1;
  repeated string declared_service_identity_labels = 2;
  repeated string declared_tailscale_tags = 3;
  repeated string observed_tailscale_tags = 4;
  optional string site = 5;
  optional string jurisdiction = 6;
  optional string cluster = 7;
  optional string tailscale_ipv4 = 8;
  optional string tailscale0_ipv4 = 9;
  TailscaleIdentityDriftStatus drift_status = 10;
  repeated string missing_declared_tags = 11;
  repeated string unexpected_observed_tags = 12;
}

enum TailscaleIdentityDriftStatus {
  TAILSCALE_IDENTITY_DRIFT_STATUS_UNSPECIFIED = 0;
  TAILSCALE_IDENTITY_DRIFT_STATUS_UNKNOWN = 1;
  TAILSCALE_IDENTITY_DRIFT_STATUS_IN_SYNC = 2;
  TAILSCALE_IDENTITY_DRIFT_STATUS_DRIFTED = 3;
  TAILSCALE_IDENTITY_DRIFT_STATUS_UNOBSERVED = 4;
}

message DockerRuntimeHealth {
  string docker_status = 1;
  string containerd_status = 2;
  optional string docker_server_version = 3;
  optional string docker_storage_driver = 4;
  optional string docker_cgroup_driver = 5;
  uint32 docker_containers_running = 6;
  uint32 docker_images_count = 7;
  uint32 docker_container_count = 8;
  repeated DockerContainerHealth containers = 9;
}

message DockerContainerHealth {
  uint32 index = 1;
  optional string container_id = 2;
  string name = 3;
  string status = 4;
  bool running = 5;
  optional string health = 6;
  uint32 restart_count = 7;
  optional google.protobuf.Timestamp started_at = 8;
  optional string image_ref = 9;
  optional string image_id = 10;
  optional string image_architecture = 11;
  optional string image_digest = 12;
  optional string command = 13;
  repeated string port_bindings = 14;
  repeated string mounts = 15;
}

message InfrastructureHealthSignal {
  string signal_id = 1;
  ServiceHealthStatus status = 2;
  google.protobuf.Timestamp collected_at = 3;
  string source = 4;
  string summary = 5;
  repeated InfrastructureHealthFact facts = 6;
}

message InfrastructureHealthFact {
  string key = 1;
  string value_json = 2;
}

message RecoveryTarget {
  ServiceActionTarget target = 1;
  optional string systemd_unit_name = 2;
  optional string container_name = 3;
}

enum RecoveryActionKind {
  RECOVERY_ACTION_KIND_UNSPECIFIED = 0;
  RECOVERY_ACTION_KIND_RESTART_SYSTEMD_UNIT = 1;
  RECOVERY_ACTION_KIND_RESTART_DOCKER_CONTAINER = 2;
  RECOVERY_ACTION_KIND_RERUN_SERVICE_OPERATION = 3;
  RECOVERY_ACTION_KIND_REDEPLOY_SERVICE = 4;
  RECOVERY_ACTION_KIND_RESTORE_BACKUP = 5;
  RECOVERY_ACTION_KIND_FAILOVER_SERVICE = 6;
  RECOVERY_ACTION_KIND_FAILBACK_SERVICE = 7;
}

message EnvironmentApplyLock {
  string environment_id = 1;
  bool apply_in_progress = 2;
  optional string active_run_id = 3;
  google.protobuf.Timestamp locked_at = 4;
}

message ServiceHealthAggregate {
  string environment_id = 1;
  string service_id = 2;
  ServiceKind service_kind = 3;
  ServiceHealthStatus status = 4;
  google.protobuf.Timestamp checked_at = 5;
}

enum ServiceHealthStatus {
  SERVICE_HEALTH_STATUS_UNSPECIFIED = 0;
  SERVICE_HEALTH_STATUS_UNKNOWN = 1;
  SERVICE_HEALTH_STATUS_HEALTHY = 2;
  SERVICE_HEALTH_STATUS_DEGRADED = 3;
  SERVICE_HEALTH_STATUS_CRITICAL = 4;
}
