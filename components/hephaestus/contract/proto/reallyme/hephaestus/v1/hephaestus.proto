  WORKFLOW_OPERATION_KIND_UNSPECIFIED = 0;
  WORKFLOW_OPERATION_KIND_CONFIGURE_SERVICE = 1;
  WORKFLOW_OPERATION_KIND_INITIALIZE_SERVICE = 2;
  WORKFLOW_OPERATION_KIND_FINALIZE_SERVICE = 3;
