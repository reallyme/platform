syntax = "proto3";

package reallyme.hephaestus.v1;

import "google/protobuf/timestamp.proto";
import "reallyme/hephaestus/v1/control_surfaces.proto";
import "reallyme/hephaestus/v1/nats.proto";
import "reallyme/hephaestus/v1/tailnet.proto";
import "reallyme/hephaestus/v1/types.proto";
import "reallyme/hephaestus/v1/typesense.proto";
import "reallyme/domain/v1/hephaestus.proto";

// HephaestusService is the topology-driven platform control-plane boundary.
service HephaestusService {
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  rpc GetDesiredTopology(GetDesiredTopologyRequest) returns (GetDesiredTopologyResponse);
  rpc UpdateDesiredTopology(UpdateDesiredTopologyRequest) returns (UpdateDesiredTopologyResponse);
  rpc ListDeployableServices(ListDeployableServicesRequest) returns (ListDeployableServicesResponse);
  rpc GetDeployableService(GetDeployableServiceRequest) returns (GetDeployableServiceResponse);
  rpc ListDeployableServiceImages(ListDeployableServiceImagesRequest) returns (ListDeployableServiceImagesResponse);
  rpc GetDeployableServiceImage(GetDeployableServiceImageRequest) returns (GetDeployableServiceImageResponse);
  rpc PlanInfra(PlanInfraRequest) returns (PlanInfraResponse);
  rpc ApplyInfra(ApplyInfraRequest) returns (ApplyInfraResponse);
  rpc RunAnsible(RunAnsibleRequest) returns (RunAnsibleResponse);
  rpc RunHealthChecks(RunHealthChecksRequest) returns (RunHealthChecksResponse);
  rpc RunRunbookAction(RunRunbookActionRequest) returns (RunRunbookActionResponse);
  rpc ListWorkflowRuns(ListWorkflowRunsRequest) returns (ListWorkflowRunsResponse);
  rpc GetWorkflowRun(GetWorkflowRunRequest) returns (GetWorkflowRunResponse);
  rpc TriggerRecovery(TriggerRecoveryRequest) returns (TriggerRecoveryResponse);
  rpc CreateNode(CreateNodeRequest) returns (CreateNodeResponse);
  rpc DeleteNode(DeleteNodeRequest) returns (DeleteNodeResponse);
  rpc RequestProviderPowerAction(RequestProviderPowerActionRequest) returns (RequestProviderPowerActionResponse);
  rpc ResizeNode(ResizeNodeRequest) returns (ResizeNodeResponse);
  rpc CreateIpv4EgressGateway(CreateIpv4EgressGatewayRequest) returns (CreateIpv4EgressGatewayResponse);
  rpc RequestFoundationDbReconfigure(RequestFoundationDbReconfigureRequest) returns (RequestFoundationDbReconfigureResponse);
  rpc GetNode(GetNodeRequest) returns (GetNodeResponse);
  rpc ReconcileNode(ReconcileNodeRequest) returns (ReconcileNodeResponse);
  rpc GetNodeHealth(GetNodeHealthRequest) returns (GetNodeHealthResponse);
  rpc ListApprovedNodeChoices(ListApprovedNodeChoicesRequest) returns (ListApprovedNodeChoicesResponse);
  rpc GetOperationalOverview(GetOperationalOverviewRequest) returns (GetOperationalOverviewResponse);
  rpc GetTailnetOverview(GetTailnetOverviewRequest) returns (GetTailnetOverviewResponse);
  rpc RegisterAgent(RegisterAgentRequest) returns (RegisterAgentResponse);
  rpc SubmitAgentReport(SubmitAgentReportRequest) returns (SubmitAgentReportResponse);
  rpc SubmitAgentBootReport(SubmitAgentBootReportRequest) returns (SubmitAgentBootReportResponse);
  rpc QueueAgentAction(QueueAgentActionRequest) returns (QueueAgentActionResponse);
  rpc QueueConfigureDockerServiceAction(QueueConfigureDockerServiceActionRequest) returns (QueueConfigureDockerServiceActionResponse);
  rpc UpgradeDockerServiceImage(UpgradeDockerServiceImageRequest) returns (UpgradeDockerServiceImageResponse);
  rpc ListQueuedAgentActions(ListQueuedAgentActionsRequest) returns (ListQueuedAgentActionsResponse);
  rpc ListAgentActionRecords(ListAgentActionRecordsRequest) returns (ListAgentActionRecordsResponse);
  rpc PollAgentActions(PollAgentActionsRequest) returns (PollAgentActionsResponse);
  rpc CompleteAgentAction(CompleteAgentActionRequest) returns (CompleteAgentActionResponse);
  rpc ResolveAgentSecret(ResolveAgentSecretRequest) returns (ResolveAgentSecretResponse);
  rpc ListAgentReports(ListAgentReportsRequest) returns (ListAgentReportsResponse);
  rpc GetAgentReportByServerId(GetAgentReportByServerIdRequest) returns (GetAgentReportByServerIdResponse);
  rpc ListNodeActualStates(ListNodeActualStatesRequest) returns (ListNodeActualStatesResponse);
  rpc GetNodeActualStateByServerId(GetNodeActualStateByServerIdRequest) returns (GetNodeActualStateByServerIdResponse);
  rpc ListServerInventory(ListServerInventoryRequest) returns (ListServerInventoryResponse);
  rpc GetNodeLiveReportByServerId(GetNodeLiveReportByServerIdRequest) returns (GetNodeLiveReportByServerIdResponse);
}

message GetStatusRequest {}

message GetStatusResponse {
  string status = 1;
}

message GetDesiredTopologyRequest {}

message GetDesiredTopologyResponse {
  DesiredTopologySnapshot snapshot = 1;
}

message UpdateDesiredTopologyRequest {
  optional string base_git_commit = 1;
  repeated DesiredTopologyDocument documents = 2;
  WorkflowActor changed_by = 3;
}

message UpdateDesiredTopologyResponse {
  DesiredTopologySnapshot snapshot = 1;
  optional string git_diff = 2;
}

message ListDeployableServicesRequest {
  optional DeployableServiceCategory category = 1;
}

message ListDeployableServicesResponse {
  repeated DeployableServiceSummary services = 1;
}

message GetDeployableServiceRequest {
  string service_id = 1;
}

message GetDeployableServiceResponse {
  DeployableService service = 1;
}

message ListDeployableServiceImagesRequest {
  string service_id = 1;
}

message ListDeployableServiceImagesResponse {
  string service_id = 1;
  repeated DeployableServiceImage images = 2;
}

message GetDeployableServiceImageRequest {
  string service_id = 1;
  string image_id = 2;
}

message GetDeployableServiceImageResponse {
  string service_id = 1;
  DeployableServiceImage image = 2;
}

message DeployableServiceSummary {
  string service_id = 1;
  string display_name = 2;
  DeployableServiceCategory category = 3;
  DeployableWorkloadKind workload_kind = 4;
  string short_description = 5;
  bool supports_ipv6_only = 6;
  bool requires_ipv4 = 7;
  string default_image_ref = 8;
  repeated string default_ports = 9;
}

message DeployableService {
  DeployableServiceSummary summary = 1;
  string description = 2;
  repeated DeployableServiceImage images = 3;
  repeated DeployableServiceSecret required_secrets = 4;
  repeated DeployableServiceAction supported_actions = 5;
  repeated string health_signals = 7;
  repeated string deployment_notes = 8;
}

message DeployableServiceImage {
  string image_id = 1;
  string registry = 2;
  string repository = 3;
  string tag = 4;
  optional string digest = 5;
  bool default_image = 6;
  string image_ref = 7;
  optional uint64 published_at_unix_seconds = 8;
  optional string source_revision = 9;
}

message DeployableServiceSecret {
  string secret_ref = 1;
  string display_name = 2;
  bool required = 3;
  string description = 4;
}

enum DeployableServiceCategory {
  DEPLOYABLE_SERVICE_CATEGORY_UNSPECIFIED = 0;
  DEPLOYABLE_SERVICE_CATEGORY_MESSAGING = 1;
  DEPLOYABLE_SERVICE_CATEGORY_SEARCH = 2;
  DEPLOYABLE_SERVICE_CATEGORY_DATABASE = 3;
  DEPLOYABLE_SERVICE_CATEGORY_OBSERVABILITY = 4;
  DEPLOYABLE_SERVICE_CATEGORY_EDGE = 5;
  DEPLOYABLE_SERVICE_CATEGORY_CONTROL_PLANE = 6;
}

enum DeployableWorkloadKind {
  DEPLOYABLE_WORKLOAD_KIND_UNSPECIFIED = 0;
  DEPLOYABLE_WORKLOAD_KIND_DOCKER = 1;
  DEPLOYABLE_WORKLOAD_KIND_FOUNDATIONDB = 2;
  DEPLOYABLE_WORKLOAD_KIND_CONTROL_PLANE = 3;
}

enum DeployableServiceAction {
  DEPLOYABLE_SERVICE_ACTION_UNSPECIFIED = 0;
  DEPLOYABLE_SERVICE_ACTION_DEPLOY = 1;
  DEPLOYABLE_SERVICE_ACTION_UPGRADE_IMAGE = 2;
  DEPLOYABLE_SERVICE_ACTION_RESTART_CONTAINER = 3;
  DEPLOYABLE_SERVICE_ACTION_RESTART_SERVICE = 4;
  DEPLOYABLE_SERVICE_ACTION_REBOOT_HOST = 5;
  DEPLOYABLE_SERVICE_ACTION_RESIZE_NODE = 6;
  DEPLOYABLE_SERVICE_ACTION_DELETE_NODE = 7;
  DEPLOYABLE_SERVICE_ACTION_RECONFIGURE_CLUSTER = 8;
}

message PlanInfraRequest {
  string environment_id = 1;
  WorkflowActor requested_by = 2;
  optional string expected_git_commit = 3;
  bool refresh_state = 4;
}

message PlanInfraResponse {
  WorkflowRun run = 1;
}

message ApplyInfraRequest {
  string environment_id = 1;
  string plan_run_id = 2;
  WorkflowActor approved_by = 3;
  optional string expected_git_commit = 4;
}

message ApplyInfraResponse {
  WorkflowRun run = 1;
}

message RunAnsibleRequest {
  string environment_id = 1;
  ServiceActionTarget target = 2;
  WorkflowOperationKind operation = 3;
  WorkflowActor requested_by = 4;
  ServiceOperationOptions options = 5;
}

message RunAnsibleResponse {
  WorkflowRun run = 1;
}

message RunHealthChecksRequest {
  string environment_id = 1;
  repeated HealthCheckTarget checks = 2;
  WorkflowActor requested_by = 3;
}

message RunHealthChecksResponse {
  WorkflowRun run = 1;
  HealthSnapshot snapshot = 2;
  InfrastructureHealthSnapshot infrastructure_snapshot = 3;
}

message RunRunbookActionRequest {
  string environment_id = 1;
  string action_id = 2;
  WorkflowActor requested_by = 3;
  bool confirmation_accepted = 4;
  optional string confirmation_text = 5;
  repeated string secret_refs = 6;
  bool dry_run = 7;
  optional string plan_run_id = 8;
  repeated string actor_role_ids = 9;
  repeated RunbookActionApproval approvals = 10;
  optional string break_glass_incident_id = 11;
  optional ProvisioningRequest provisioning_request = 12;
}

message RunRunbookActionResponse {
  WorkflowRun run = 1;
  InfrastructureHealthSnapshot infrastructure_snapshot = 2;
  optional ProvisioningPlan provisioning_plan = 3;
}

message ProvisioningRequest {
  uint32 schema_version = 1;
  string request_id = 2;
  ProvisioningAction action = 3;
  ProvisioningService service = 4;
  ProvisioningEnvironment environment = 5;
  ProvisioningSite site = 6;
  ProvisioningDataRegion data_region = 7;
  ProvisioningInstancePlan plan = 8;
  MachineImageRef machine_image = 9;
  ProvisioningIngressMode ingress_mode = 10;
  uint32 replicas = 11;
  bool allow_replace = 12;
  bool allow_public_ingress = 13;
  repeated ProvisioningSecretRef secret_refs = 14;
  bool dry_run = 15;
  ProvisioningNatsRole nats_role = 16;
  ProvisioningTypesenseRole typesense_role = 17;
  InfrastructureProvider provider = 18;
  ProvisioningNodeType node_type = 19;
  ProvisioningOs os = 20;
  ProvisioningPlacementKind placement_kind = 21;
  string idempotency_key = 22;
  ProvisioningFoundationDbRole foundationdb_role = 23;
  ProvisioningWorkloadRole workload_role = 24;
}

message ProvisioningPlan {
  uint32 schema_version = 1;
  string request_id = 2;
  ProvisioningAction action = 3;
  bool supported = 4;
  ProvisioningResolutionStatus resolution_status = 5;
  bool dry_run = 6;
  ProvisioningPlanDerived derived = 7;
  ProvisioningPlanExecution execution = 8;
  repeated string errors = 9;
}

message ProvisioningPlanDerived {
  string provider = 1;
  optional string provider_environment_id = 2;
  ProvisioningService service = 3;
  ProvisioningEnvironment environment = 4;
  ProvisioningSite site = 5;
  string provider_location = 6;
  ProvisioningDataRegion data_region = 7;
  ProvisioningInstancePlan plan = 8;
  uint32 replicas = 9;
  ProvisioningIngressMode ingress_mode = 10;
  bool public_ingress = 11;
  repeated TailnetTagKind tailscale_tags = 12;
  repeated string provider_tags = 13;
  optional uint32 service_port = 14;
  MachineImageRef machine_image = 15;
  optional string owner_repository = 16;
  ProvisioningSourceRepository source_repository = 17;
  ProvisioningNatsRole nats_role = 18;
  ProvisioningTypesenseRole typesense_role = 19;
  InfrastructureProvider provider_kind = 20;
  ProvisioningNodeType node_type = 21;
  ProvisioningOs os = 22;
  ProvisioningPlacementKind placement_kind = 23;
  ProvisioningReconciliationStatus reconciliation_status = 24;
  string idempotency_key = 25;
  ProvisioningFoundationDbRole foundationdb_role = 26;
  ProvisioningWorkloadRole workload_role = 27;
}

message ProvisioningSourceRepository {
  string id = 1;
  string kind = 2;
  string owner = 3;
  string repository = 4;
  repeated string owns_services = 5;
  string artifact_policy = 6;
}

message ProvisioningPlanExecution {
  ProvisioningExecutionMode mode = 1;
  bool execute_via_shell = 2;
  bool allow_replace = 3;
  repeated ProvisioningRequiredSecretBinding required_secret_bindings = 4;
  repeated ProvisioningCommand commands = 5;
  optional string unsupported_reason = 6;
}

message ProvisioningRequiredSecretBinding {
  string id = 1;
  string env_var = 2;
  string secret_ref = 3;
}

message ProvisioningCommand {
  string phase = 1;
  string executable = 2;
  repeated string argv = 3;
  repeated ProvisioningCommandEnvBinding env = 4;
}

message ProvisioningCommandEnvBinding {
  string env_var = 1;
  string from_secret_ref = 2;
}

enum ProvisioningAction {
  PROVISIONING_ACTION_UNSPECIFIED = 0;
  PROVISIONING_ACTION_CREATE_SERVER = 1;
}

enum ProvisioningResolutionStatus {
  PROVISIONING_RESOLUTION_STATUS_UNSPECIFIED = 0;
  PROVISIONING_RESOLUTION_STATUS_READY = 1;
  PROVISIONING_RESOLUTION_STATUS_PLANNED = 2;
  PROVISIONING_RESOLUTION_STATUS_INVALID = 3;
}

enum ProvisioningReconciliationStatus {
  PROVISIONING_RECONCILIATION_STATUS_UNSPECIFIED = 0;
  PROVISIONING_RECONCILIATION_STATUS_NOT_STARTED = 1;
  PROVISIONING_RECONCILIATION_STATUS_REQUESTED = 2;
  PROVISIONING_RECONCILIATION_STATUS_PROVIDER_OBSERVED = 3;
  PROVISIONING_RECONCILIATION_STATUS_TAILNET_OBSERVED = 4;
  PROVISIONING_RECONCILIATION_STATUS_HEALTHY = 5;
  PROVISIONING_RECONCILIATION_STATUS_DRIFTED = 6;
  PROVISIONING_RECONCILIATION_STATUS_FAILED = 7;
}

enum ProvisioningExecutionMode {
  PROVISIONING_EXECUTION_MODE_UNSPECIFIED = 0;
  PROVISIONING_EXECUTION_MODE_ARGV_ONLY = 1;
}

message InfrastructureActionRequest {
  uint32 schema_version = 1;
  string environment_id = 2;
  string action_id = 3;
  string actor_id = 4;
  InfrastructureActionConfirmation confirmation = 5;
  repeated string secret_refs = 6;
  bool dry_run = 7;
}

message InfrastructureActionConfirmation {
  optional string typed_text = 1;
  optional bool accepted = 2;
}

message InfrastructureActionEvent {
  uint32 schema_version = 1;
  InfrastructureActionEventType event_type = 2;
  string invocation_id = 3;
  string environment_id = 4;
  string action_id = 5;
  string actor_id = 6;
  google.protobuf.Timestamp created_at = 7;
  optional uint32 exit_code = 8;
  optional string redacted_summary = 9;
}

enum InfrastructureActionEventType {
  INFRASTRUCTURE_ACTION_EVENT_TYPE_UNSPECIFIED = 0;
  INFRASTRUCTURE_ACTION_EVENT_TYPE_ACTION_QUEUED = 1;
  INFRASTRUCTURE_ACTION_EVENT_TYPE_PREFLIGHT_STARTED = 2;
  INFRASTRUCTURE_ACTION_EVENT_TYPE_PREFLIGHT_FAILED = 3;
  INFRASTRUCTURE_ACTION_EVENT_TYPE_CONFIRMATION_REQUIRED = 4;
  INFRASTRUCTURE_ACTION_EVENT_TYPE_ACTION_STARTED = 5;
  INFRASTRUCTURE_ACTION_EVENT_TYPE_ACTION_SUCCEEDED = 6;
  INFRASTRUCTURE_ACTION_EVENT_TYPE_ACTION_FAILED = 7;
  INFRASTRUCTURE_ACTION_EVENT_TYPE_ACTION_CANCELED = 8;
  INFRASTRUCTURE_ACTION_EVENT_TYPE_ACTION_TIMED_OUT = 9;
}

message InfrastructureJsonSchemaDocument {
  string relative_path = 1;
  string schema_id = 2;
  string title = 3;
  repeated string required_fields = 4;
  repeated string property_names = 5;
  string schema_json = 6;
}

message InfrastructureOperationalDocument {
  string relative_path = 1;
  string title = 2;
  string body = 3;
}

message ListWorkflowRunsRequest {
  optional string environment_id = 1;
  optional WorkflowRunKind kind = 2;
  uint32 limit = 3;
}

message ListWorkflowRunsResponse {
  repeated WorkflowRun runs = 1;
}

message GetWorkflowRunRequest {
  string run_id = 1;
}

message GetWorkflowRunResponse {
  WorkflowRun run = 1;
  repeated WorkflowRunEvent events = 2;
}

message TriggerRecoveryRequest {
  string environment_id = 1;
  RecoveryTarget target = 2;
  RecoveryActionKind action = 3;
  WorkflowActor requested_by = 4;
  ServiceOperationOptions options = 5;
}

message TriggerRecoveryResponse {
  WorkflowRun run = 1;
}

message CreateNodeRequest {
  ProvisioningRequest provisioning_request = 1;
  WorkflowActor requested_by = 2;
}

message CreateNodeResponse {
  ProvisioningPlan plan = 1;
  WorkflowRun run = 2;
  repeated reallyme.domain.v1.HephaestusServerInventoryRow inventory_rows = 3;
  ProvisioningReconciliationStatus reconciliation_status = 4;
}

message DeleteNodeRequest {
  string server_id = 1;
  string idempotency_key = 2;
  WorkflowActor requested_by = 3;
  bool dry_run = 4;
}

message DeleteNodeResponse {
  string server_id = 1;
  ProvisioningReconciliationStatus reconciliation_status = 2;
  reallyme.domain.v1.HephaestusServerInventoryRow inventory_row = 3;
}

enum ProviderPowerActionKind {
  PROVIDER_POWER_ACTION_KIND_UNSPECIFIED = 0;
  PROVIDER_POWER_ACTION_KIND_SOFT_REBOOT = 1;
  PROVIDER_POWER_ACTION_KIND_HARD_RESET = 2;
  PROVIDER_POWER_ACTION_KIND_POWER_ON = 3;
  PROVIDER_POWER_ACTION_KIND_POWER_OFF = 4;
}

message RequestProviderPowerActionRequest {
  string server_id = 1;
  ProviderPowerActionKind action = 2;
  string idempotency_key = 3;
  WorkflowActor requested_by = 4;
  bool dry_run = 5;
}

message RequestProviderPowerActionResponse {
  string server_id = 1;
  ProviderPowerActionKind action = 2;
  ProvisioningReconciliationStatus reconciliation_status = 3;
  reallyme.domain.v1.HephaestusServerInventoryRow inventory_row = 4;
  bool requested = 5;
}

message ResizeNodeRequest {
  string server_id = 1;
  ProvisioningInstancePlan target_plan = 2;
  bool upgrade_disk = 3;
  string idempotency_key = 4;
  WorkflowActor requested_by = 5;
  bool dry_run = 6;
}

message ResizeNodeResponse {
  string server_id = 1;
  ProvisioningInstancePlan target_plan = 2;
  ProvisioningReconciliationStatus reconciliation_status = 3;
  reallyme.domain.v1.HephaestusServerInventoryRow inventory_row = 4;
  bool requested = 5;
}

message CreateIpv4EgressGatewayRequest {
  InfrastructureProvider provider = 1;
  ProvisioningEnvironment environment = 2;
  ProvisioningDataRegion data_region = 3;
  ProvisioningSite site = 4;
  ProvisioningInstancePlan plan = 5;
  string private_ipv4 = 6;
  string server_id = 7;
  string idempotency_key = 8;
  WorkflowActor requested_by = 9;
  bool dry_run = 10;
}

message CreateIpv4EgressGatewayResponse {
  string server_id = 1;
  string provider_server_id = 2;
  string private_ipv4 = 3;
  string network_zone = 4;
  ProvisioningReconciliationStatus reconciliation_status = 5;
  reallyme.domain.v1.HephaestusServerInventoryRow inventory_row = 6;
  bool requested = 7;
}

message RequestFoundationDbReconfigureRequest {
  ProvisioningEnvironment environment = 1;
  ProvisioningDataRegion data_region = 2;
  FoundationDbRedundancyMode redundancy_mode = 3;
  string idempotency_key = 4;
  WorkflowActor requested_by = 5;
  bool dry_run = 6;
}

message RequestFoundationDbReconfigureResponse {
  ProvisioningEnvironment environment = 1;
  ProvisioningDataRegion data_region = 2;
  FoundationDbRedundancyMode redundancy_mode = 3;
  repeated string target_node_ids = 4;
  ProvisioningReconciliationStatus reconciliation_status = 5;
  bool requested = 6;
}

message GetNodeRequest {
  string server_id = 1;
}

message GetNodeResponse {
  reallyme.domain.v1.HephaestusServerInventoryRow inventory_row = 1;
  reallyme.domain.v1.HephaestusNodeActualState actual_state = 2;
}

message ReconcileNodeRequest {
  string server_id = 1;
  string idempotency_key = 2;
  WorkflowActor requested_by = 3;
}

message ReconcileNodeResponse {
  string server_id = 1;
  ProvisioningReconciliationStatus reconciliation_status = 2;
  reallyme.domain.v1.HephaestusServerInventoryRow inventory_row = 3;
  reallyme.domain.v1.HephaestusNodeActualState actual_state = 4;
}

message GetNodeHealthRequest {
  string server_id = 1;
}

message GetNodeHealthResponse {
  string server_id = 1;
  ProvisioningReconciliationStatus reconciliation_status = 2;
  reallyme.domain.v1.HephaestusServerInventoryRow inventory_row = 3;
  reallyme.domain.v1.HephaestusNodeActualState actual_state = 4;
  AgentReportStatus agent_report_status = 5;
  bool has_full_report = 6;
  reallyme.domain.v1.HephaestusAgentReport latest_agent_report = 7;
}

enum AgentReportStatus {
  AGENT_REPORT_STATUS_UNSPECIFIED = 0;
  AGENT_REPORT_STATUS_REGISTERED_NO_REPORT = 1;
  AGENT_REPORT_STATUS_REPORTING = 2;
  AGENT_REPORT_STATUS_STALE = 3;
  AGENT_REPORT_STATUS_OFFLINE = 4;
}

message ListApprovedNodeChoicesRequest {}

message ListApprovedNodeChoicesResponse {
  repeated DashboardSiteOption sites = 1;
  repeated DashboardPlanOption plans = 2;
  repeated DashboardServiceOption services = 3;
  repeated ProviderCatalog provider_catalogs = 4;
  ProviderLocationMatrix location_matrix = 5;
}

message GetOperationalOverviewRequest {}

message GetOperationalOverviewResponse {
  repeated InfrastructureEnvironment environments = 1;
  repeated EnvironmentApplyLock environment_locks = 2;
  repeated WorkflowRun recent_runs = 3;
  repeated reallyme.domain.v1.HephaestusServerInventoryRow inventory_rows = 4;
  repeated ServiceHealthAggregate service_health = 5;
  RunbookCatalog runbook_catalog = 6;
  DockerImageCatalog docker_image_catalog = 7;
  repeated ProviderCatalog provider_catalogs = 8;
  HealthSignalCatalog health_signal_catalog = 9;
  RbacPolicyCatalog rbac_policy = 10;
  repeated DockerServiceDefinition docker_service_definitions = 11;
  repeated InfrastructureActionRequest action_request_examples = 12;
  repeated InfrastructureJsonSchemaDocument json_schemas = 13;
  repeated InfrastructureOperationalDocument operational_documents = 14;
  repeated InfrastructureHealthSnapshot health_snapshots = 15;
  ServiceMeshProjection service_mesh = 16;
  InternalDnsProjection internal_dns = 17;
  ObservabilityProjection observability = 18;
  NodeTopologyProjection node_topology = 19;
  DashboardControlSurfaceProjection dashboard_control_surface = 20;
  TailnetOverview tailnet = 21;
  ControlPlaneSurfaceCatalog control_plane_surfaces = 22;
}

message GetTailnetOverviewRequest {}

message GetTailnetOverviewResponse {
  TailnetOverview tailnet = 1;
  ControlPlaneSurfaceCatalog control_plane_surfaces = 2;
}

message SubmitAgentReportRequest {
  reallyme.domain.v1.HephaestusAgentReport report = 1;
}

message SubmitAgentReportResponse {
  reallyme.domain.v1.HephaestusAgentReport report = 1;
}

message SubmitAgentBootReportRequest {
  reallyme.domain.v1.HephaestusAgentBootReport report = 1;
  string boot_secret = 2;
}

message SubmitAgentBootReportResponse {
  reallyme.domain.v1.HephaestusAgentBootReportResult result = 1;
  reallyme.domain.v1.HephaestusNodeActualState actual_state = 2;
}

message RegisterAgentRequest {
  reallyme.domain.v1.HephaestusAgentBootReport report = 1;
  string bootstrap_token = 2;
  string agent_version = 3;
  string agent_public_key = 4;
  string agent_public_key_fingerprint = 5;
  string agent_registration_signature = 6;
}

message RegisterAgentResponse {
  reallyme.domain.v1.HephaestusAgentBootReportResult result = 1;
  reallyme.domain.v1.HephaestusNodeActualState actual_state = 2;
  string runtime_token = 3;
  uint64 desired_generation = 4;
  uint32 poll_after_seconds = 5;
}

message PollAgentActionsRequest {
  string node_id = 1;
  string agent_version = 2;
  uint64 observed_generation = 3;
}

message QueueConfigureDockerServiceActionRequest {
  string node_id = 1;
  string idempotency_key = 2;
  uint64 desired_generation = 3;
  uint32 deadline_seconds = 4;
  AgentDockerServiceAction docker_service = 5;
}

message QueueConfigureDockerServiceActionResponse {
  AgentAction action = 1;
  bool queued = 2;
}

message UpgradeDockerServiceImageRequest {
  string node_id = 1;
  string idempotency_key = 2;
  uint64 desired_generation = 3;
  uint32 deadline_seconds = 4;
  AgentDockerServiceAction docker_service = 5;
}

message UpgradeDockerServiceImageResponse {
  AgentAction action = 1;
  bool queued = 2;
}

message QueueAgentActionRequest {
  string node_id = 1;
  string idempotency_key = 2;
  uint64 desired_generation = 3;
  uint32 deadline_seconds = 4;
  AgentActionKind kind = 5;
  optional AgentDockerAction docker = 6;
  optional AgentSystemdAction systemd = 7;
  optional AgentTailscaleServiceAction tailscale_service = 8;
  optional AgentRebootAction reboot = 9;
  optional AgentDockerServiceAction docker_service = 10;
  optional AgentFoundationDbServiceAction foundationdb_service = 11;
}

message QueueAgentActionResponse {
  AgentAction action = 1;
  bool queued = 2;
}

message ListQueuedAgentActionsRequest {
