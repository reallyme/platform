syntax = "proto3";

package reallyme.hephaestus.v1;

message ProvisioningSecretRef {
  string id = 1;
  string secret_ref = 2;
}

enum InfrastructureProvider {
  INFRASTRUCTURE_PROVIDER_UNSPECIFIED = 0;
  INFRASTRUCTURE_PROVIDER_VULTR = 1;
  INFRASTRUCTURE_PROVIDER_CLOUDFLARE = 2;
  INFRASTRUCTURE_PROVIDER_HETZNER = 3;
  INFRASTRUCTURE_PROVIDER_GITHUB = 4;
  INFRASTRUCTURE_PROVIDER_LOCAL = 5;
}

enum ProvisioningEnvironment {
  PROVISIONING_ENVIRONMENT_UNSPECIFIED = 0;
  PROVISIONING_ENVIRONMENT_STAGING = 1;
  PROVISIONING_ENVIRONMENT_PROD = 2;
  PROVISIONING_ENVIRONMENT_DEV = 3;
}

enum ProvisioningDataRegion {
  PROVISIONING_DATA_REGION_UNSPECIFIED = 0;
  PROVISIONING_DATA_REGION_EU = 1;
  PROVISIONING_DATA_REGION_US = 2;
  PROVISIONING_DATA_REGION_NONE = 3;
}

enum ProvisioningPlacementKind {
  PROVISIONING_PLACEMENT_KIND_UNSPECIFIED = 0;
  PROVISIONING_PLACEMENT_KIND_REGIONAL = 1;
  PROVISIONING_PLACEMENT_KIND_EDGE = 2;
}

// ProvisioningSite is provider-neutral and follows the airport-code convention.
// Provider adapters map these to provider-specific location ids such as Vultr
// `sao` for GRU or Hetzner `fsn1` for LEJ.
enum ProvisioningSite {
  PROVISIONING_SITE_UNSPECIFIED = 0;
  PROVISIONING_SITE_AMS = 1; // Amsterdam
  PROVISIONING_SITE_ASH = 2; // Ashburn provider-code alias retained for catalogs
  PROVISIONING_SITE_ATL = 3; // Atlanta
  PROVISIONING_SITE_BLR = 4; // Bangalore
  PROVISIONING_SITE_BOM = 5; // Mumbai
  PROVISIONING_SITE_CDG = 6; // Paris
  PROVISIONING_SITE_DEL = 7; // Delhi NCR
  PROVISIONING_SITE_DFW = 8; // Dallas
  PROVISIONING_SITE_EWR = 9; // New Jersey / New York metro
  PROVISIONING_SITE_FRA = 10; // Frankfurt
  PROVISIONING_SITE_GRU = 11; // Sao Paulo
  PROVISIONING_SITE_HEL = 12; // Helsinki
  PROVISIONING_SITE_HNL = 13; // Honolulu
  PROVISIONING_SITE_IAD = 14; // Ashburn canonical airport
  PROVISIONING_SITE_ICN = 15; // Seoul
  PROVISIONING_SITE_ITM = 16; // Osaka
  PROVISIONING_SITE_JNB = 17; // Johannesburg
  PROVISIONING_SITE_LAX = 18; // Los Angeles
  PROVISIONING_SITE_LEJ = 19; // Falkenstein / Leipzig area
  PROVISIONING_SITE_LHR = 20; // London
  PROVISIONING_SITE_MAD = 21; // Madrid
  PROVISIONING_SITE_MAN = 22; // Manchester
  PROVISIONING_SITE_MEL = 23; // Melbourne
  PROVISIONING_SITE_MEX = 24; // Mexico City
  PROVISIONING_SITE_MIA = 25; // Miami
  PROVISIONING_SITE_MXP = 26; // Milan
  PROVISIONING_SITE_NRT = 27; // Tokyo
  PROVISIONING_SITE_NUE = 28; // Nuremberg
  PROVISIONING_SITE_ORD = 29; // Chicago
  PROVISIONING_SITE_PDX = 30; // Hillsboro / Portland area
  PROVISIONING_SITE_SCL = 31; // Santiago
  PROVISIONING_SITE_SEA = 32; // Seattle
  PROVISIONING_SITE_SIN = 33; // Singapore
  PROVISIONING_SITE_SJC = 34; // Silicon Valley
  PROVISIONING_SITE_STO = 35; // Stockholm
  PROVISIONING_SITE_SYD = 36; // Sydney
  PROVISIONING_SITE_TLV = 37; // Tel Aviv
  PROVISIONING_SITE_WAW = 38; // Warsaw
  PROVISIONING_SITE_YTO = 39; // Toronto
}

message ProviderLocationMapping {
  InfrastructureProvider provider = 1;
  string provider_location_id = 2;
  ProvisioningSite site = 3;
  ProvisioningDataRegion data_region = 4;
  string city = 5;
  string country = 6;
  string provider_network_zone = 7;
  repeated ProviderLocationCapability capabilities = 8;
  bool canonical = 9;
  string notes = 10;
  ProvisioningPlacementKind placement_kind = 11;
}

message ProviderLocationMatrix {
  repeated ProviderLocationMapping locations = 1;
}

enum ProviderLocationCapability {
  PROVIDER_LOCATION_CAPABILITY_UNSPECIFIED = 0;
  PROVIDER_LOCATION_CAPABILITY_COMPUTE = 1;
  PROVIDER_LOCATION_CAPABILITY_LOAD_BALANCER = 2;
  PROVIDER_LOCATION_CAPABILITY_KUBERNETES = 3;
  PROVIDER_LOCATION_CAPABILITY_BLOCK_STORAGE = 4;
  PROVIDER_LOCATION_CAPABILITY_NAT_GATEWAY = 5;
  PROVIDER_LOCATION_CAPABILITY_PRIVATE_NETWORK = 6;
}

// ProviderServerCapability describes what Hephaestus needs from a provider.
// Provider adapters map these capabilities to provider-specific APIs, resource
// names, and execution quirks behind a stable control-plane boundary.
enum ProviderServerCapability {
  PROVIDER_SERVER_CAPABILITY_UNSPECIFIED = 0;
  PROVIDER_SERVER_CAPABILITY_CREATE_SERVER = 1;
  PROVIDER_SERVER_CAPABILITY_DELETE_SERVER = 2;
  PROVIDER_SERVER_CAPABILITY_GET_SERVER = 3;
  PROVIDER_SERVER_CAPABILITY_LIST_PLANS = 4;
  PROVIDER_SERVER_CAPABILITY_LIST_LOCATIONS = 5;
  PROVIDER_SERVER_CAPABILITY_LIST_IMAGES = 6;
  PROVIDER_SERVER_CAPABILITY_ATTACH_FIREWALL = 7;
  PROVIDER_SERVER_CAPABILITY_ATTACH_NETWORK = 8;
  PROVIDER_SERVER_CAPABILITY_RENDER_CLOUD_INIT = 9;
  PROVIDER_SERVER_CAPABILITY_SNAPSHOT_GOLDEN_IMAGE = 10;
  PROVIDER_SERVER_CAPABILITY_REGISTRY_AUTH = 11;
}

enum ProvisioningIngressMode {
  PROVISIONING_INGRESS_MODE_UNSPECIFIED = 0;
  PROVISIONING_INGRESS_MODE_VULTR_LOAD_BALANCER = 1;
  PROVISIONING_INGRESS_MODE_HETZNER_LOAD_BALANCER = 2;
  PROVISIONING_INGRESS_MODE_CADDY = 3;
  PROVISIONING_INGRESS_MODE_INTERNAL_ONLY = 4;
}

