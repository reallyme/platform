  PROVISIONING_NATS_ROLE_UNSPECIFIED = 0;
  PROVISIONING_NATS_ROLE_REGIONAL = 1;
  PROVISIONING_NATS_ROLE_GATEWAY = 2;
  PROVISIONING_NATS_ROLE_EDGE_LEAF = 3;
}

enum ProvisioningTypesenseRole {
  PROVISIONING_TYPESENSE_ROLE_UNSPECIFIED = 0;
  PROVISIONING_TYPESENSE_ROLE_CLUSTER_MEMBER = 1;
}

enum ProvisioningFoundationDbRole {
  PROVISIONING_FOUNDATION_DB_ROLE_UNSPECIFIED = 0;
  PROVISIONING_FOUNDATION_DB_ROLE_PRIMARY = 1;
  PROVISIONING_FOUNDATION_DB_ROLE_SECONDARY = 2;
  PROVISIONING_FOUNDATION_DB_ROLE_WITNESS = 3;
  PROVISIONING_FOUNDATION_DB_ROLE_COORDINATOR = 4;
}

enum ProvisioningService {
  PROVISIONING_SERVICE_UNSPECIFIED = 0;
  PROVISIONING_SERVICE_API = 1;
  PROVISIONING_SERVICE_WEB = 2;
  PROVISIONING_SERVICE_NATS = 3;
  PROVISIONING_SERVICE_TYPESENSE = 4;
  PROVISIONING_SERVICE_CADDY_EDGE = 5;
  PROVISIONING_SERVICE_FDB = 6;
  PROVISIONING_SERVICE_OBSERVABILITY = 7;
}

enum ProvisioningNodeType {
  PROVISIONING_NODE_TYPE_UNSPECIFIED = 0;
  PROVISIONING_NODE_TYPE_VPS = 1;
  PROVISIONING_NODE_TYPE_LOAD_BALANCER = 2;
}

enum ProvisioningMachineImageSource {
  PROVISIONING_MACHINE_IMAGE_SOURCE_UNSPECIFIED = 0;
  PROVISIONING_MACHINE_IMAGE_SOURCE_PROVIDER_OS = 1;
  PROVISIONING_MACHINE_IMAGE_SOURCE_PROVIDER_IMAGE = 2;
  PROVISIONING_MACHINE_IMAGE_SOURCE_PROVIDER_SNAPSHOT = 3;
  PROVISIONING_MACHINE_IMAGE_SOURCE_GOLDEN_IMAGE = 4;
}

enum ProvisioningContainerImageSource {
  PROVISIONING_CONTAINER_IMAGE_SOURCE_UNSPECIFIED = 0;
  PROVISIONING_CONTAINER_IMAGE_SOURCE_GITHUB_CONTAINER_REGISTRY = 1;
  PROVISIONING_CONTAINER_IMAGE_SOURCE_VULTR_CONTAINER_REGISTRY = 2;
  PROVISIONING_CONTAINER_IMAGE_SOURCE_HETZNER_CONTAINER_REGISTRY = 3;
  PROVISIONING_CONTAINER_IMAGE_SOURCE_LOCAL_ARCHIVE = 4;
}

message MachineImageRef {
  ProvisioningMachineImageSource source = 1;
  string image_ref = 2;
  optional string digest = 3;
  ProvisioningOs os = 4;
}

message ContainerImageRef {
  ProvisioningContainerImageSource source = 1;
  string registry = 2;
  string repository = 3;
  string tag = 4;
  optional string digest = 5;
  ProvisioningSecretRef auth_secret_ref = 6;
}

enum ProvisioningOs {
  PROVISIONING_OS_UNSPECIFIED = 0;
  PROVISIONING_OS_UBUNTU_26_04_LTS = 1;
}

