syntax = "proto3";

package reallyme.hephaestus.v1;

import "reallyme/hephaestus/v1/types.proto";

service TypesenseService {
  rpc PlanTypesenseDeployment(PlanTypesenseDeploymentRequest) returns (PlanTypesenseDeploymentResponse);
}

message PlanTypesenseDeploymentRequest {
  TypesenseNodeDeploymentIntent intent = 1;
}

message PlanTypesenseDeploymentResponse {
  optional TypesenseDeploymentPlan plan = 1;
  repeated TypesenseValidationError errors = 2;
}

message TypesenseServiceSpec {
  repeated TypesenseReplicationGroup replication_groups = 1;
}

message TypesenseReplicationGroup {
  string group_id = 1;
  repeated ProvisioningDataRegion data_regions = 2;
  uint32 replica_count = 3;
}

message TypesenseNodeDeploymentIntent {
  ProvisioningTypesenseRole role = 1;
  string node_name = 2;
  uint32 api_port = 3;
  uint32 peering_port = 4;
  repeated TypesenseClusterPeer cluster_peers = 5;
  optional string peering_address = 6;
  ProvisioningSecretRef api_key_secret_ref = 7;
  string api_key_file_path = 8;
  string listen_address = 9;
  string data_dir = 10;
  bool cors_enabled = 11;
  repeated string cors_domains = 12;
  optional TypesenseTlsConfig tls = 13;
  optional TypesenseLoggingConfig logging = 14;
  optional TypesenseResourceGuardrails resource_guardrails = 15;
  uint32 private_peer_cidr_count = 16;
  uint32 admin_peer_cidr_count = 17;
}

message TypesenseClusterPeer {
  string address = 1;
  uint32 peering_port = 2;
  uint32 api_port = 3;
}

message TypesenseTlsConfig {
  string certificate_path = 1;
  string certificate_key_path = 2;
  optional uint32 refresh_interval_seconds = 3;
}

message TypesenseLoggingConfig {
  optional string log_dir = 1;
  bool access_logging_enabled = 2;
  bool search_logging_enabled = 3;
  optional uint32 slow_requests_time_ms = 4;
  optional uint32 slow_searches_time_ms = 5;
}

message TypesenseResourceGuardrails {
  optional uint32 memory_used_max_percentage = 1;
  optional uint32 disk_used_max_percentage = 2;
}

message TypesenseDeploymentPlan {
  TypesenseRuntimeConfig runtime_config = 1;
  repeated uint32 private_tcp_ports = 2;
  repeated TypesenseHttpProbe probes = 3;
  string validation_collection_name = 4;
}

message TypesenseRuntimeConfig {
  ProvisioningTypesenseRole role = 1;
  string node_name = 2;
  uint32 api_port = 3;
  uint32 peering_port = 4;
  repeated TypesenseClusterPeer cluster_peers = 5;
  optional string peering_address = 6;
  ProvisioningSecretRef api_key_secret_ref = 7;
  string api_key_file_path = 8;
  string listen_address = 9;
  string data_dir = 10;
  bool cors_enabled = 11;
  repeated string cors_domains = 12;
  optional TypesenseTlsConfig tls = 13;
  optional TypesenseLoggingConfig logging = 14;
  optional TypesenseResourceGuardrails resource_guardrails = 15;
}

message TypesenseHttpProbe {
  uint32 port = 1;
  string path = 2;
  optional string required_body_fragment = 3;
  bool requires_api_key = 4;
}

message TypesenseValidationError {
  TypesenseValidationErrorReason reason = 1;
}

enum TypesenseValidationErrorReason {
  TYPESENSE_VALIDATION_ERROR_REASON_UNSPECIFIED = 0;
  TYPESENSE_VALIDATION_ERROR_REASON_INVALID_ROLE = 1;
  TYPESENSE_VALIDATION_ERROR_REASON_INVALID_IDENTIFIER = 2;
  TYPESENSE_VALIDATION_ERROR_REASON_INVALID_PORT = 3;
  TYPESENSE_VALIDATION_ERROR_REASON_DUPLICATE_PORT = 4;
  TYPESENSE_VALIDATION_ERROR_REASON_INVALID_PEER_ADDRESS = 5;
  TYPESENSE_VALIDATION_ERROR_REASON_INVALID_PATH = 6;
  TYPESENSE_VALIDATION_ERROR_REASON_MISSING_SECRET_REF = 7;
  TYPESENSE_VALIDATION_ERROR_REASON_MISSING_PEER_CIDRS = 8;
  TYPESENSE_VALIDATION_ERROR_REASON_MISSING_PEERING_ADDRESS = 9;
  TYPESENSE_VALIDATION_ERROR_REASON_UNEXPECTED_PEERING_ADDRESS = 10;
  TYPESENSE_VALIDATION_ERROR_REASON_MISSING_CORS_DOMAINS = 11;
  TYPESENSE_VALIDATION_ERROR_REASON_INVALID_TLS_CONFIG = 12;
  TYPESENSE_VALIDATION_ERROR_REASON_INVALID_PERCENTAGE = 13;
}
