syntax = "proto3";

package reallyme.hephaestus.v1;

import "reallyme/hephaestus/v1/types.proto";

// VpsService plans provider-neutral VPS/server intent before any provider
// adapter renders OpenTofu variables, Ansible inventory, or cloud-init.
service VpsService {
  rpc PlanVps(PlanVpsRequest) returns (PlanVpsResponse);
}

message PlanVpsRequest {
  VpsDeploymentIntent intent = 1;
}

message PlanVpsResponse {
  optional VpsDeploymentPlan plan = 1;
  repeated VpsValidationError errors = 2;
}

message VpsDeploymentIntent {
  uint32 schema_version = 1;
  string request_id = 2;
  InfrastructureProvider provider = 3;
  ProvisioningEnvironment environment = 4;
  ProvisioningDataRegion data_region = 5;
  ProvisioningSite site = 6;
  ProvisioningService service = 7;
  ProvisioningPlacementKind placement_kind = 8;
  ProvisioningLifecycleAction action = 9;
  ProvisioningInstancePlan plan = 10;
  MachineImageRef image = 11;
  ProvisioningNodeType node_type = 12;
  ProvisioningIngressMode ingress_mode = 13;
  ProvisioningRuntime runtime = 14;
  string hostname = 15;
  string provider_label = 16;
  uint32 replica_ordinal = 17;
  repeated string temporary_public_bootstrap_ssh_cidrs = 18;
  repeated string admin_tailnet_cidrs = 19;
  repeated uint32 private_tcp_ports = 20;
  repeated uint32 public_tcp_ports = 21;
  repeated string provider_tags = 22;
  repeated ProvisioningSecretRef secret_refs = 23;
  bool tailnet_bootstrap = 24;
  bool allow_public_ingress = 25;
  ProvisioningNatsRole nats_role = 26;
  ProvisioningTypesenseRole typesense_role = 27;
  ProvisioningFoundationDbRole foundationdb_role = 28;
  ProvisioningWorkloadRole workload_role = 29;
}

message VpsDeploymentPlan {
  VpsRuntimeConfig runtime_config = 1;
  VpsProviderAdapterPlan provider_adapter = 2;
  VpsFirewallPlan firewall = 3;
  VpsBootstrapPlan bootstrap = 4;
  repeated VpsPlannedOperation operations = 5;
}

message VpsRuntimeConfig {
  InfrastructureProvider provider = 1;
  ProvisioningEnvironment environment = 2;
  ProvisioningDataRegion data_region = 3;
  ProvisioningSite site = 4;
  ProvisioningService service = 5;
  ProvisioningPlacementKind placement_kind = 6;
  ProvisioningInstancePlan plan = 7;
  MachineImageRef image = 8;
  ProvisioningNodeType node_type = 9;
  ProvisioningIngressMode ingress_mode = 10;
  ProvisioningRuntime runtime = 11;
  string hostname = 12;
  string provider_label = 13;
  uint32 replica_ordinal = 14;
  repeated string provider_tags = 15;
  ProvisioningNatsRole nats_role = 16;
  ProvisioningTypesenseRole typesense_role = 17;
  ProvisioningFoundationDbRole foundationdb_role = 18;
  ProvisioningWorkloadRole workload_role = 19;
}

message VpsProviderAdapterPlan {
  InfrastructureProvider provider = 1;
  string provider_location_id = 2;
  string instance_plan_id = 3;
  string image_ref = 4;
  string os_id = 5;
  bool provider_neutral = 6;
}

message VpsFirewallPlan {
  repeated string temporary_public_bootstrap_ssh_cidrs = 1;
  repeated string admin_tailnet_cidrs = 2;
  repeated uint32 private_tcp_ports = 3;
  repeated uint32 public_tcp_ports = 4;
  bool public_ingress_allowed = 5;
}

message VpsBootstrapPlan {
  bool tailnet_bootstrap = 1;
  repeated ProvisioningSecretRef required_secret_refs = 2;
}

message VpsPlannedOperation {
  ProvisioningLifecycleAction action = 1;
  string phase = 2;
}

message VpsValidationError {
  VpsValidationErrorReason reason = 1;
}

enum VpsValidationErrorReason {
  VPS_VALIDATION_ERROR_REASON_UNSPECIFIED = 0;
  VPS_VALIDATION_ERROR_REASON_UNSUPPORTED_SCHEMA_VERSION = 1;
  VPS_VALIDATION_ERROR_REASON_INVALID_IDENTIFIER = 2;
  VPS_VALIDATION_ERROR_REASON_INVALID_ACTION = 3;
  VPS_VALIDATION_ERROR_REASON_INVALID_ROLE = 4;
  VPS_VALIDATION_ERROR_REASON_INVALID_PORT = 5;
  VPS_VALIDATION_ERROR_REASON_INVALID_CIDR = 6;
  VPS_VALIDATION_ERROR_REASON_MISSING_BOOTSTRAP_CIDR = 7;
  VPS_VALIDATION_ERROR_REASON_MISSING_SECRET_REF = 8;
  VPS_VALIDATION_ERROR_REASON_MISSING_IMAGE_REF = 9;
  VPS_VALIDATION_ERROR_REASON_INVALID_PROVIDER_PLAN = 10;
  VPS_VALIDATION_ERROR_REASON_INVALID_NODE_TYPE = 11;
  VPS_VALIDATION_ERROR_REASON_PUBLIC_PORT_REQUIRES_PUBLIC_INGRESS = 12;
}
