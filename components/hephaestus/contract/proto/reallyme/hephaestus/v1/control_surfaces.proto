syntax = "proto3";

package reallyme.hephaestus.v1;

// ControlPlaneSurfaceCatalog names the external automation surfaces Hephaestus
// models directly before any adapter is allowed to execute them.
message ControlPlaneSurfaceCatalog {
  uint32 schema_version = 1;
  OpenTofuSurface opentofu = 2;
  AnsibleSurface ansible = 3;
  TailscaleApiSurface tailscale = 4;
}

// OpenTofuSurface describes the machine-readable OpenTofu operations and JSON
// outputs that Rust adapters must parse into typed results.
message OpenTofuSurface {
  repeated OpenTofuOperation operations = 1;
  repeated OpenTofuResourceKind resource_kinds = 2;
  repeated OpenTofuChangeAction change_actions = 3;
  repeated OpenTofuChangeReason change_reasons = 4;
  repeated string sensitive_json_paths = 5;
}

enum OpenTofuOperation {
  OPEN_TOFU_OPERATION_UNSPECIFIED = 0;
  OPEN_TOFU_OPERATION_INIT = 1;
  OPEN_TOFU_OPERATION_VALIDATE = 2;
  OPEN_TOFU_OPERATION_PLAN = 3;
  OPEN_TOFU_OPERATION_APPLY = 4;
  OPEN_TOFU_OPERATION_DESTROY = 5;
  OPEN_TOFU_OPERATION_SHOW_PLAN_JSON = 6;
  OPEN_TOFU_OPERATION_SHOW_STATE_JSON = 7;
  OPEN_TOFU_OPERATION_OUTPUT_JSON = 8;
}

enum OpenTofuResourceKind {
  OPEN_TOFU_RESOURCE_KIND_UNSPECIFIED = 0;
  OPEN_TOFU_RESOURCE_KIND_SERVER = 1;
  OPEN_TOFU_RESOURCE_KIND_NETWORK = 2;
  OPEN_TOFU_RESOURCE_KIND_FIREWALL = 3;
  OPEN_TOFU_RESOURCE_KIND_LOAD_BALANCER = 4;
  OPEN_TOFU_RESOURCE_KIND_SSH_KEY = 5;
  OPEN_TOFU_RESOURCE_KIND_IMAGE = 6;
  OPEN_TOFU_RESOURCE_KIND_SNAPSHOT = 7;
  OPEN_TOFU_RESOURCE_KIND_VOLUME = 8;
  OPEN_TOFU_RESOURCE_KIND_OBJECT_STORAGE = 9;
  OPEN_TOFU_RESOURCE_KIND_DNS = 10;
}

enum OpenTofuChangeAction {
  OPEN_TOFU_CHANGE_ACTION_UNSPECIFIED = 0;
  OPEN_TOFU_CHANGE_ACTION_NOOP = 1;
  OPEN_TOFU_CHANGE_ACTION_CREATE = 2;
  OPEN_TOFU_CHANGE_ACTION_READ = 3;
  OPEN_TOFU_CHANGE_ACTION_UPDATE = 4;
  OPEN_TOFU_CHANGE_ACTION_REPLACE = 5;
  OPEN_TOFU_CHANGE_ACTION_DELETE = 6;
  OPEN_TOFU_CHANGE_ACTION_MOVE = 7;
}

enum OpenTofuChangeReason {
  OPEN_TOFU_CHANGE_REASON_UNSPECIFIED = 0;
  OPEN_TOFU_CHANGE_REASON_REQUESTED = 1;
  OPEN_TOFU_CHANGE_REASON_TAINTED = 2;
  OPEN_TOFU_CHANGE_REASON_CANNOT_UPDATE = 3;
  OPEN_TOFU_CHANGE_REASON_MISSING_RESOURCE_CONFIG = 4;
  OPEN_TOFU_CHANGE_REASON_PROVIDER_DRIFT = 5;
}

// AnsibleSurface describes the Ansible Runner concepts Hephaestus exposes as
// typed Connect results instead of free-form playbook logs.
message AnsibleSurface {
  repeated AnsibleOperation operations = 1;
  repeated AnsibleEventKind event_kinds = 2;
  repeated AnsibleHostStatus host_statuses = 3;
  repeated string supported_runner_artifacts = 4;
}

enum AnsibleOperation {
  ANSIBLE_OPERATION_UNSPECIFIED = 0;
  ANSIBLE_OPERATION_RUN_PLAYBOOK = 1;
  ANSIBLE_OPERATION_CHECK_PLAYBOOK = 2;
  ANSIBLE_OPERATION_GATHER_FACTS = 3;
  ANSIBLE_OPERATION_RENDER_INVENTORY = 4;
  ANSIBLE_OPERATION_INSPECT_ROLE_ARGUMENT_SPEC = 5;
}

enum AnsibleEventKind {
  ANSIBLE_EVENT_KIND_UNSPECIFIED = 0;
  ANSIBLE_EVENT_KIND_PLAYBOOK_ON_START = 1;
  ANSIBLE_EVENT_KIND_PLAYBOOK_ON_PLAY_START = 2;
  ANSIBLE_EVENT_KIND_PLAYBOOK_ON_TASK_START = 3;
  ANSIBLE_EVENT_KIND_RUNNER_ON_OK = 4;
  ANSIBLE_EVENT_KIND_RUNNER_ON_CHANGED = 5;
  ANSIBLE_EVENT_KIND_RUNNER_ON_FAILED = 6;
  ANSIBLE_EVENT_KIND_RUNNER_ON_UNREACHABLE = 7;
  ANSIBLE_EVENT_KIND_RUNNER_ON_SKIPPED = 8;
  ANSIBLE_EVENT_KIND_PLAYBOOK_ON_STATS = 9;
}

enum AnsibleHostStatus {
  ANSIBLE_HOST_STATUS_UNSPECIFIED = 0;
  ANSIBLE_HOST_STATUS_OK = 1;
  ANSIBLE_HOST_STATUS_CHANGED = 2;
  ANSIBLE_HOST_STATUS_FAILED = 3;
  ANSIBLE_HOST_STATUS_UNREACHABLE = 4;
  ANSIBLE_HOST_STATUS_SKIPPED = 5;
  ANSIBLE_HOST_STATUS_RESCUED = 6;
  ANSIBLE_HOST_STATUS_IGNORED = 7;
}

// TailscaleApiSurface captures the read-first API areas behind the dashboard's
// tailnet tab and the later controlled mutation workflows.
message TailscaleApiSurface {
  repeated TailscaleApiOperation operations = 1;
  repeated TailscalePolicySection policy_sections = 2;
  repeated TailscaleDeviceOperation device_operations = 3;
}

enum TailscaleApiOperation {
  TAILSCALE_API_OPERATION_UNSPECIFIED = 0;
  TAILSCALE_API_OPERATION_LIST_DEVICES = 1;
  TAILSCALE_API_OPERATION_GET_DEVICE = 2;
  TAILSCALE_API_OPERATION_GET_POLICY = 3;
  TAILSCALE_API_OPERATION_VALIDATE_POLICY = 4;
  TAILSCALE_API_OPERATION_LIST_SERVICES = 5;
  TAILSCALE_API_OPERATION_GET_SERVICE = 6;
  TAILSCALE_API_OPERATION_LIST_ROUTES = 7;
  TAILSCALE_API_OPERATION_LIST_AUTH_KEYS = 8;
}

enum TailscalePolicySection {
  TAILSCALE_POLICY_SECTION_UNSPECIFIED = 0;
  TAILSCALE_POLICY_SECTION_TAG_OWNERS = 1;
  TAILSCALE_POLICY_SECTION_GRANTS = 2;
  TAILSCALE_POLICY_SECTION_ACLS = 3;
  TAILSCALE_POLICY_SECTION_SSH = 4;
  TAILSCALE_POLICY_SECTION_AUTO_APPROVERS = 5;
  TAILSCALE_POLICY_SECTION_GROUPS = 6;
  TAILSCALE_POLICY_SECTION_HOSTS = 7;
  TAILSCALE_POLICY_SECTION_NODE_ATTRS = 8;
  TAILSCALE_POLICY_SECTION_TESTS = 9;
  TAILSCALE_POLICY_SECTION_SSH_TESTS = 10;
  TAILSCALE_POLICY_SECTION_IP_SETS = 11;
}

enum TailscaleDeviceOperation {
  TAILSCALE_DEVICE_OPERATION_UNSPECIFIED = 0;
  TAILSCALE_DEVICE_OPERATION_UPDATE_TAGS = 1;
  TAILSCALE_DEVICE_OPERATION_AUTHORIZE = 2;
  TAILSCALE_DEVICE_OPERATION_EXPIRE_KEY = 3;
  TAILSCALE_DEVICE_OPERATION_DELETE = 4;
  TAILSCALE_DEVICE_OPERATION_APPROVE_ROUTES = 5;
  TAILSCALE_DEVICE_OPERATION_REVOKE_ROUTES = 6;
}
