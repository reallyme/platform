version: v2
plugins:
  - local: protoc-gen-buffa
    out: src/generated/buffa
    strategy: all
    opt: [views=true, json=true]
  - local: protoc-gen-buffa-packaging
    out: src/generated/buffa
    strategy: all
  - local: protoc-gen-connect-rust
    out: src/generated/connect
    opt: [buffa_module=crate::generated::proto]
  - local: protoc-gen-buffa-packaging
    out: src/generated/connect
    strategy: all
    opt: [filter=services]
  - local: ../../../../hephaestus-web/node_modules/.bin/protoc-gen-es
    out: ../../../../hephaestus-web/app/lib/contract
    opt: [target=ts, import_extension=.js]
  - local: ../../../../hephaestus-web/node_modules/.bin/protoc-gen-connect-es
    out: ../../../../hephaestus-web/app/lib/contract
    opt: [target=ts, import_extension=.js]
