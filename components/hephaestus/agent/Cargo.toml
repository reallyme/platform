[package]
name = "hephaestus-agent"
description = "Node-local infrastructure actuator for the ReallyMe Hephaestus control plane"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["infrastructure", "orchestration", "deployment", "agent", "control-plane"]
categories = ["command-line-utilities", "network-programming"]
publish = ["crates-io"]

[dependencies]
buffa.workspace = true
connectrpc = { workspace = true, features = ["client", "client-tls"] }
http.workspace = true
reallyme-codec = { workspace = true, features = ["base64url"] }
reallyme-crypto.workspace = true
reallyme-hephaestus-domain.workspace = true
reallyme-hephaestus-contract = { workspace = true, features = ["generated"] }
reqwest.workspace = true
rustls-native-certs.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
zeroize.workspace = true

tempfile.workspace = true
