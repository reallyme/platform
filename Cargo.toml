[workspace]
members = [
    "apps/example",
    "apps/example/contract",
    "conformance/tls-providers",
    "crates/platform",
    "kits/app",
    "kits/foundationdb",
    "kits/nats",
    "kits/postgres",
    "kits/s3",
    "kits/server",
    "kits/typesense",
    "kits/valkey",
    "servers/example",
    "workers/example",
]
resolver = "2"

[workspace.package]
version = "0.3.2"
edition = "2024"
rust-version = "1.99.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/reallyme/platform"

[workspace.dependencies]
async-nats = { version = "0.50.0", default-features = false, features = ["jetstream", "nuid", "ring"] }
# The WebSocket close-code mapper downcasts Axum's decoder error. Review the
# paired tungstenite pin and live decoder test before changing this version.
axum = "=0.8.9"
axum-test = { version = "21", default-features = false }
bb8 = "0.9.1"
bb8-postgres = "0.9.0"
buffa = { version = "0.9.2", features = ["json"] }
buffa-types = { version = "0.9.2", features = ["json"] }
connectrpc = { version = "0.9.1", default-features = false }
foundationdb = { version = "0.11.0", default-features = false }
futures-util = "0.3"
http = "1"
http-body = "1"
http-body-util = "0.1"
metrics = "0.24"
# We use `PrometheusBuilder::install_recorder()` plus `PrometheusHandle::render()`
# and expose `/metrics` through our own Axum runtime route. Disable the crate's
# built-in HTTP listener and push gateway so we do not pull TLS/client stacks
# such as hyper-rustls/rustls/aws-lc-rs that are unnecessary for render-only use.
metrics-exporter-prometheus = { version = "0.18", default-features = false }
metrics-util = "0.20"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9.42"
temp-env = "0.3.6"
tempfile = "3"
subtle = { version = "2", default-features = false }
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-postgres = { version = "0.7.18", default-features = false, features = ["runtime", "with-serde_json-1", "with-uuid-1"] }
tokio-postgres-rustls = { version = "0.14.0", default-features = false, features = ["ring"] }
tokio-tungstenite = "0.30"
# Axum 0.8.9 wraps this exact decoder error type. The live close-code test
# verifies the downcast against a real Axum WebSocket decoder.
tungstenite = { version = "=0.29.0", default-features = false }
tonic = "0.14"
tonic-health = "0.14"
tonic-prost = "0.14"
tonic-reflection = "0.14"
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
bytes = "1"
pin-project-lite = "0.2"
reqwest = { version = "0.13.5", default-features = false, features = ["gzip", "http2", "json", "query", "rustls-no-provider"] }
hyper = { version = "1", default-features = false, features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", default-features = false, features = ["http1", "http2", "server-auto", "service", "tokio"] }
redis = { version = "1.7.1", default-features = false, features = ["connection-manager", "tokio-rustls-comp", "tls-rustls-webpki-roots"] }
reallyme-codec = { version = "=0.3.1", default-features = false }
reallyme-crypto = { version = "=0.3.12", default-features = false, features = ["native", "dispatch", "ed25519", "hmac", "jwk", "p256", "rsa", "sha2"] }
rustls-native-certs = "0.8.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1.0.9"
time = { version = "0.3", default-features = false, features = ["formatting", "macros", "parsing", "std"] }
tower = { version = "0.5", features = ["limit", "load-shed", "timeout"] }
tower-http = { version = "0.7", features = ["catch-panic", "cors", "limit", "request-id", "timeout", "trace"] }
tracing = "0.1"
tracing-opentelemetry = { version = "0.34", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
toml = "1.1.6"
url = "2"
nkeys = "0.4.5"
uuid = { version = "1", features = ["serde"] }
worker = { version = "=0.8.7", default-features = false }
zeroize = { version = "1", features = ["derive"] }

# Workspace-local crates use the same release version and are declared here so
# member manifests express only their feature requirements, not path/version policy.
example-app = { path = "apps/example", version = "0.3.2", default-features = false }
reallyme-app-kit = { path = "kits/app", version = "0.3.2" }
reallyme-example-contract = { path = "apps/example/contract", version = "0.3.2" }
reallyme-foundationdb-kit = { path = "kits/foundationdb", version = "0.3.2" }
reallyme-nats-kit = { path = "kits/nats", version = "0.3.2" }
reallyme-postgres-kit = { path = "kits/postgres", version = "0.3.2" }
reallyme-s3-kit = { path = "kits/s3", version = "0.3.2", default-features = false }
reallyme-server-kit = { path = "kits/server", version = "0.3.2", default-features = false }
reallyme-typesense-kit = { path = "kits/typesense", version = "0.3.2" }
reallyme-valkey-kit = { path = "kits/valkey", version = "0.3.2" }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
overflow-checks = true

# wasm-bindgen's catch-wrapper transform requires the externref table that
# Cargo's symbol stripping removes from the final Worker Wasm module.
[profile.release.package.example-worker]
strip = "none"
