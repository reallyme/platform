[package]
name = "reallyme-platform"
description = "Application architecture for taking Rust services from framework to production"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["application", "architecture", "server", "connect-rpc", "cloudflare-workers"]
categories = ["asynchronous", "development-tools", "web-programming"]
publish = ["crates-io"]
readme = "README.md"
include = ["/src/**/*.rs", "/Cargo.toml", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[features]
default = ["native-server"]
native-server = ["dep:reallyme-server-kit", "reallyme-server-kit/default"]
foundationdb = ["dep:reallyme-foundationdb-kit"]
hephaestus = ["dep:reallyme-hephaestus-contract", "dep:reallyme-hephaestus-domain"]
nats = ["dep:reallyme-nats-kit"]
postgres = ["dep:reallyme-postgres-kit"]
s3 = ["dep:reallyme-s3-kit"]
typesense = ["dep:reallyme-typesense-kit"]
valkey = ["dep:reallyme-valkey-kit"]

[dependencies]
reallyme-app-kit.workspace = true
reallyme-foundationdb-kit = { workspace = true, optional = true }
reallyme-hephaestus-contract = { workspace = true, optional = true }
reallyme-hephaestus-domain = { workspace = true, optional = true }
reallyme-nats-kit = { workspace = true, optional = true }
reallyme-postgres-kit = { workspace = true, optional = true }
reallyme-s3-kit = { workspace = true, optional = true }
reallyme-server-kit = { workspace = true, optional = true }
reallyme-typesense-kit = { workspace = true, optional = true }
reallyme-valkey-kit = { workspace = true, optional = true }

[workspace]
members = [
    "apps/example",
    "apps/example/contract",
    "components/hephaestus/contract",
    "components/hephaestus/domain",
    "components/hephaestus/agent",
    "kits/reallyme-app-kit",
    "kits/reallyme-foundationdb-kit",
    "kits/reallyme-postgres-kit",
    "kits/reallyme-nats-kit",
    "kits/reallyme-typesense-kit",
    "kits/reallyme-server-kit",
    "kits/reallyme-valkey-kit",
    "kits/reallyme-s3-kit",
    "servers/example-server",
    "workers/example-worker",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/reallyme/platform"

[workspace.dependencies]
async-nats = { version = "0.50.0", default-features = false, features = ["jetstream", "nuid", "ring"] }
axum = "0.8"
axum-test = { version = "21", default-features = false }
bb8 = "0.9.1"
bb8-postgres = "0.9.0"
buffa = { version = "0.9.2", features = ["json"] }
buffa-types = { version = "0.9.2", features = ["json"] }
connectrpc = { version = "0.9.0", default-features = false }
foundationdb = { version = "0.11.0", default-features = false }
futures-util = "0.3"
http = "1"
metrics = "0.24"
# We use `PrometheusBuilder::install_recorder()` plus `PrometheusHandle::render()`
# and expose `/metrics` through our own Axum runtime route. Disable the crate's
# built-in HTTP listener and push gateway so we do not pull TLS/client stacks
# such as hyper-rustls/rustls/aws-lc-rs that are unnecessary for render-only use.
metrics-exporter-prometheus = { version = "0.18", default-features = false }
metrics-util = "0.20"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9.42"
temp-env = "0.3.6"
tempfile = "3"
subtle = { version = "2", default-features = false }
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-postgres = { version = "0.7.18", default-features = false, features = ["runtime", "with-serde_json-1", "with-uuid-1"] }
tokio-postgres-rustls = { version = "0.14.0", default-features = false, features = ["ring"] }
tokio-tungstenite = "0.30"
tonic = "0.14"
tonic-health = "0.14"
tonic-prost = "0.14"
tonic-reflection = "0.14"
opentelemetry = { version = "0.32", default-features = false, features = ["trace"] }
bytes = "1"
pin-project-lite = "0.2"
reqwest = { version = "0.13.4", default-features = false, features = ["gzip", "http2", "json", "query", "rustls"] }
redis = { version = "1.6.0", default-features = false, features = ["connection-manager", "tokio-rustls-comp", "tls-rustls-webpki-roots"] }
reallyme-codec = { version = "0.2.3", default-features = false }
reallyme-crypto = { version = "=0.3.9", default-features = false, features = ["native", "dispatch", "ed25519", "hmac", "jwk", "p256", "rsa", "sha2"] }
rustls-native-certs = "0.8.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
time = { version = "0.3", default-features = false, features = ["formatting", "macros", "parsing", "std"] }
tower = { version = "0.5", features = ["limit", "timeout"] }
tower-http = { version = "0.7", features = ["cors", "limit", "request-id", "timeout", "trace"] }
tracing = "0.1"
tracing-opentelemetry = { version = "0.33", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
toml = "1.1.5"
url = "2"
nkeys = "0.4.5"
uuid = { version = "1", features = ["serde"] }
worker = { version = "=0.8.5", default-features = false, features = ["d1"] }
zeroize = { version = "1", features = ["derive"] }

# Workspace-local crates use the same release version and are declared here so
# member manifests express only their feature requirements, not path/version policy.
example-app = { path = "apps/example", version = "0.1.0", default-features = false }
reallyme-app-kit = { path = "kits/reallyme-app-kit", version = "0.1.0" }
reallyme-example-contract = { path = "apps/example/contract", version = "0.1.0" }
reallyme-foundationdb-kit = { path = "kits/reallyme-foundationdb-kit", version = "0.1.0" }
reallyme-hephaestus-contract = { path = "components/hephaestus/contract", version = "0.1.0" }
reallyme-hephaestus-domain = { path = "components/hephaestus/domain", version = "0.1.0" }
reallyme-nats-kit = { path = "kits/reallyme-nats-kit", version = "0.1.0" }
reallyme-postgres-kit = { path = "kits/reallyme-postgres-kit", version = "0.1.0" }
reallyme-s3-kit = { path = "kits/reallyme-s3-kit", version = "0.1.0" }
reallyme-server-kit = { path = "kits/reallyme-server-kit", version = "0.1.0", default-features = false }
reallyme-typesense-kit = { path = "kits/reallyme-typesense-kit", version = "0.1.0" }
reallyme-valkey-kit = { path = "kits/reallyme-valkey-kit", version = "0.1.0" }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"

[lints]
workspace = true
